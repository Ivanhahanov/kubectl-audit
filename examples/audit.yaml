# Example audit.yaml — copy to your repo root and adjust.
#
# Every field has a CLI flag equivalent (see `kubectl-audit scan --help`);
# flags override whatever is set here.

target:
  # cluster: only the live cluster via kubeconfig
  # static:  only the paths listed below
  # both:    static paths + the live cluster (default)
  mode: both

  # Kube context to use in cluster mode. Empty = current context.
  context: ""

  # Scan every namespace (cluster mode). Set to false and list `namespaces`
  # to scope to specific namespaces.
  allNamespaces: true
  namespaces: []

  # Static manifest files/directories to audit (used in "static"/"both" mode).
  paths:
    - ./manifests

  # Namespaces to skip entirely, regardless of mode. Defaults to these two
  # (see README: Noise reduction) since they hold nothing worth auditing.
  # kube-system is deliberately NOT excluded by default — see README for
  # why. Ignored if `namespaces` above is a non-empty allowlist.
  excludeNamespaces:
    - kube-public
    - kube-node-lease

  # Kubernetes' own built-in Role/ClusterRole/*Binding objects (name
  # prefix "system:") are excluded from RBAC findings by default, since
  # they're cluster-managed and can't be remediated. Set to true to
  # include them.
  includeSystemRBAC: false

policies:
  # Extra directories of custom ValidatingAdmissionPolicy YAML to load
  # alongside the bundled policies.
  dirs:
    - ./policies-custom

  # Disable specific bundled or custom policies by their metadata.name.
  disable: []
  #  - workload.no-latest-tag

  # Set to false to run only custom policies from `dirs`.
  builtin: true

output:
  json: findings.json
  markdown: report.md
  # Minimum severity that makes `scan`/`rbac analyze` exit 1:
  # none|low|medium|high|critical.
  failOn: high
  # Custom report.md.tpl (Go text/template). Empty uses the built-in
  # template (`kubectl-audit template dump` to get a starting point).
  template: ""
  # Collapse a check's repeated per-namespace findings in the Markdown
  # report when the same Kind+Name pair fires identically in at least this
  # many distinct namespaces — the common multi-tenant shape (e.g. Capsule
  # tenant namespaces all deploying the same manifest). 0 disables it.
  namespaceGroupThreshold: 3
  # Also collapse names sharing a generated-identifier shape (a UUID, or another
  # long hex/digit run), not just an identical literal name — catches e.g.
  # per-tenant Namespace objects themselves named "usersvs-<uuid>". On by default.
  groupByNamePattern: true

compliance:
  # Requirement framework(s) to score findings against: cis|fstec|nsa (see
  # compliance-mappings/ in the repo for the full control tables), or a
  # path to your own private mapping (see docs/custom-checks.md).
  frameworks:
    - cis
    # - fstec
    # - nsa
    # - ./our-standard.yaml

  # When a framework above was chosen deliberately (not just left at the
  # "cis" default), this also scopes the findings themselves to it: a
  # check the standard never asked about is dropped before it reaches any
  # output or --fail-on, not just the scorecard. Defaults to true whenever
  # `frameworks` is explicitly set here or via --frameworks; set false to
  # keep the full check set alongside a scorecard for one standard.
  # frameworksOnly: true

# A false positive or an accepted risk you don't want to wait on someone
# else to triage — add your own exclusion rule here instead. Suppressed
# findings aren't silently dropped: they still show up in report.md's
# "Suppressed" section (with `reason` attached) and findings.json's
# `suppressed` array — they just don't count toward --fail-on.
exclusions:
  - # Restricts this rule to specific checks; omit (or ["*"]) to apply it
    # to every check.
    policyIds:
      - workload.no-latest-tag

    # At least one of kind/namespace/name/labels is required — an empty
    # match is rejected at load time (it would silently suppress
    # everything). All fields set here must match (AND).
    match:
      kind: Deployment          # exact match
      namespace: legacy         # exact match
      name: "legacy-*"          # path.Match glob; a literal name still
                                 # works as an exact match
      # labels:                 # every key must be present with this
      #   team: platform-legacy # exact value on the source object

    # Required — shown next to every finding this rule suppresses.
    reason: "Legacy app pending migration, tracked in JIRA-1234"

# Configures `kubectl triage` (see docs/triage.md). No credential
# field here: the Jira Personal Access Token always comes from
# --jira-token or $KUBECTL_AUDIT_JIRA_TOKEN, never this file.
# triage:
#   stateFile: triage-state.yaml
#   # A bundled Russian title/description/remediation applies to every check
#   # automatically, no config needed (see docs/triage.md > Knowledge base).
#   # Point this at a file to correct one entry or add your own
#   # organization's wording; merged on top of the bundle, field by field.
#   # knowledgeBaseFile: knowledge-base.yaml
#   jira:
#     baseUrl: https://jira.example.com
#     projectKey: SEC
#     issueType: Bug
#     # Static labels added to every created issue, beyond the auto-derived
#     # severity/category/tag ones.
#     extraLabels:
#       - platform-team
#     # Merged into every created issue's Jira fields, keyed by Jira field
#     # ID. A string value is rendered as a Go template (same data as the
#     # summary/description templates); any other value (a number, bool, or
#     # an object like {value: Prod} for a select-list field) is sent as-is.
#     customFields:
#       customfield_10010: "severity={{.Finding.Severity}}"
#       customfield_10020:
#         value: Prod
#     # Paths to external Go text/template files that fully replace the
#     # built-in summary/description structure. Empty (the default) uses
#     # the built-in template — get a starting point with
#     # `kubectl triage jira template dump --kind summary --out summary.tpl`.
#     summaryTemplate: /path/to/summary.tpl
#     descriptionTemplate: /path/to/description.tpl

# Disable individual built-in exclusion rules by id (cilium-agent,
# prometheus-node-exporter, falco, tetragon, kube-proxy, control-plane-static-pods — see
# internal/suppress/builtin-exclusions.yaml) while leaving the rest active.
# --no-builtin-exceptions / disableBuiltinExceptions: true disables all of
# them at once instead.
disableBuiltinExceptionIds: []
#  - cilium-agent

# Extend the built-in third-party component inventory with your own
# in-house operators/CNIs (see docs/third-party-operators.md) — no
# rebuild needed, works the same when installed via krew. Adding an entry
# here does NOT by itself create a suppression exception; pair a
# System-category entry with your own `exclusions` rule above for that.
components:
  extra: []
  #  - name: InternalWidgetOperator
  #    category: Application       # System | Application (default: Application)
  #    group: internal.example.com
  #    labels:
  #      app.kubernetes.io/name: internal-widget-operator
