# Example wiring for running kubectl-audit as an in-cluster Job/CronJob
# (rather than a human's local kubeconfig, which just needs the same verbs
# on their own user/group). Namespace is illustrative — adjust as needed.
# Pick exactly one ClusterRoleBinding: bind kubectl-audit-readonly (from
# clusterrole-readonly.yaml) for a normal scan, or
# kubectl-audit-readonly-with-secrets (from clusterrole-with-secrets.yaml)
# only if this job runs with --read-secret-values.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubectl-audit
  namespace: kubectl-audit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubectl-audit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubectl-audit-readonly # or kubectl-audit-readonly-with-secrets
subjects:
  - kind: ServiceAccount
    name: kubectl-audit
    namespace: kubectl-audit
