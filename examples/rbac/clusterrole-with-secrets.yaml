# Elevated ClusterRole for kubectl-audit scan --read-secret-values.
# Everything clusterrole-readonly.yaml grants, PLUS get/list/watch on
# Secrets — required only for the small number of checks that can tell
# "authentication is left at its documented default/disabled value" no
# other way (see docs/secrets-mode.md for exactly which checks, and why
# they can never leak the actual secret value into a finding: they only
# ever compare object.data against a known/expected literal and always
# emit a static message — see
# internal/engine/secret_policy_safety_test.go's
# TestSecretTargetingPoliciesNeverUseMessageExpression, which enforces that
# structurally at the test level).
#
# Standalone on purpose (not aggregated onto clusterrole-readonly.yaml via
# aggregationRule) — apply this INSTEAD of clusterrole-readonly.yaml, not
# alongside it, so there's exactly one ClusterRole to reason about per
# privilege tier. Every normal scan should use clusterrole-readonly.yaml;
# reach for this one only when you're intentionally running with
# --read-secret-values.
#
# Kept in sync by hand — see
# internal/loader/cluster_test.go's TestClusterRoleManifestsCoverKnownResources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubectl-audit-readonly-with-secrets
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - namespaces
      - serviceaccounts
      - configmaps
      - secrets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - clusterroles
      - rolebindings
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
      - ingresses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumnetworkpolicies
      - ciliumclusterwidenetworkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["crd.projectcalico.org"]
    resources:
      - networkpolicies
      - globalnetworkpolicies
      - felixconfigurations
    verbs: ["get", "list", "watch"]
  - apiGroups: ["capsule.clastix.io"]
    resources: ["tenants"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["security.istio.io"]
    resources:
      - peerauthentications
      - authorizationpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.istio.io"]
    resources:
      - destinationrules
      - gateways
      - sidecars
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources:
      - appprojects
      - applications
    verbs: ["get", "list", "watch"]
  - apiGroups: ["secrets.hashicorp.com"]
    resources:
      - vaultconnections
      - vaultauths
    verbs: ["get", "list", "watch"]
  - apiGroups: ["fluentbit.fluent.io"]
    resources:
      - outputs
      - clusteroutputs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["operator.victoriametrics.com"]
    resources:
      - vmsingles
      - vmclusters
      - vmauths
      - vmagents
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kyverno.io"]
    resources:
      - clusterpolicies
      - policies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apisix.apache.org"]
    resources: ["apisixtlses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kubevirt.io"]
    resources:
      - kubevirts
      - virtualmachines
      - virtualmachineinstances
    verbs: ["get", "list", "watch"]
  - apiGroups: ["temporal.io"]
    resources: ["temporalclusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["loki.grafana.com"]
    resources: ["lokistacks"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*", "/version"]
    verbs: ["get"]
