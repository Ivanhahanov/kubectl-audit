<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}">kubectl-audit</a>
    <a class="gh" href="https://github.com/{{ site.repository }}">GitHub ↗</a>
  </header>

  <div class="layout">
    <nav class="sidenav">
      {% include nav.html %}
    </nav>

    <main class="content">
      {{ content }}
    </main>
  </div>

  <footer class="footer">
    <a href="https://github.com/{{ site.repository }}">{{ site.repository }}</a> · Apache-2.0
  </footer>
</div>
</body>
</html>
