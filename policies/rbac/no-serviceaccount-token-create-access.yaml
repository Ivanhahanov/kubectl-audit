apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: rbac.no-serviceaccount-token-create-access
  annotations:
    audit.k8s-auditor.io/title: "Role/ClusterRole grants create access on the serviceaccounts/token sub-resource"
    audit.k8s-auditor.io/severity: high
    audit.k8s-auditor.io/category: rbac
    audit.k8s-auditor.io/remediation: >-
      Remove create access to serviceaccounts/token unless the subject is a
      trusted, audited token-issuing controller. It allows minting new,
      potentially long-lived tokens for any ServiceAccount in scope,
      independent of that ServiceAccount's own permissions.
    audit.k8s-auditor.io/cis: "5.1.13"
    audit.k8s-auditor.io/verification-steps: >-
      1. Identify the subject bound and confirm it's a genuine, trusted
      token-issuing controller. 2. If unexpected, test the practical
      exploit: this grants minting new tokens for ANY ServiceAccount in
      scope, independent of the calling subject's own permissions — confirm
      whether the grant is namespaced (one namespace's ServiceAccounts) or
      cluster-wide (`roles` vs `clusterroles` in the finding's Resource) to
      judge real blast radius.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["roles", "clusterroles"]
  validations:
    - expression: |-
        !has(object.rules) || object.rules.all(r,
          !(
            has(r.apiGroups) && (r.apiGroups.exists(g, g == "") || r.apiGroups.exists(g, g == "*")) &&
            has(r.resources) && (r.resources.exists(x, x == "serviceaccounts/token") || r.resources.exists(x, x == "*")) &&
            has(r.verbs) && (r.verbs.exists(v, v == "create") || r.verbs.exists(v, v == "*"))
          )
        )
      message: "Role/ClusterRole grants create access on the serviceaccounts/token sub-resource."
