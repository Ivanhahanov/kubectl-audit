apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: rbac.no-persistentvolume-create-access
  annotations:
    audit.k8s-auditor.io/title: "Role/ClusterRole grants create access on PersistentVolumes"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: rbac
    audit.k8s-auditor.io/remediation: >-
      Remove create access to persistentvolumes unless the subject is a
      trusted storage-provisioning controller. A PersistentVolume can
      reference a hostPath, so create access here can be used to reach the
      node's filesystem even when workload.no-hostpath-volumes blocks
      hostPath volumes at the Pod level directly.
    audit.k8s-auditor.io/cis: "5.1.9"
    audit.k8s-auditor.io/verification-steps: >-
      1. Identify the subject bound and confirm it's a trusted storage-
      provisioning controller (e.g. the cluster's CSI provisioner) vs.
      something else. 2. If unexpected, treat this as a hostPath-volume
      risk via a different path: PersistentVolume create access can
      reference a hostPath and reach the node's filesystem even on a
      cluster where workload.no-hostpath-volumes already blocks hostPath at
      the Pod level directly — check whether that Pod-level control is
      actually being bypassed this way.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["roles", "clusterroles"]
  validations:
    - expression: |-
        !has(object.rules) || object.rules.all(r,
          !(
            has(r.apiGroups) && (r.apiGroups.exists(g, g == "") || r.apiGroups.exists(g, g == "*")) &&
            has(r.resources) && (r.resources.exists(x, x == "persistentvolumes") || r.resources.exists(x, x == "*")) &&
            has(r.verbs) && (r.verbs.exists(v, v == "create") || r.verbs.exists(v, v == "*"))
          )
        )
      message: "Role/ClusterRole grants create access on the persistentvolumes resource."
