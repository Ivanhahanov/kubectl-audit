apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: rbac.no-anonymous-binding
  annotations:
    audit.k8s-auditor.io/title: "Role bound to an anonymous or unauthenticated subject"
    audit.k8s-auditor.io/severity: critical
    audit.k8s-auditor.io/category: rbac
    audit.k8s-auditor.io/remediation: >-
      Remove system:anonymous / system:unauthenticated from the binding's
      subjects. Any permission granted here is usable by anyone who can
      reach the API server without credentials.
    audit.k8s-auditor.io/cis: "5.1.1"
    audit.k8s-auditor.io/verification-steps: >-
      1. Confirm the binding is real (`kubectl describe rolebinding/clusterrolebinding
      <name>`) and identify exactly what role it grants — even a seemingly
      minor role bound to system:anonymous is exploitable by anyone who can
      reach the API server without credentials. 2. Test directly: `kubectl
      auth can-i <verb> <resource> --as=system:anonymous` (or
      --as=system:unauthenticated) to confirm the grant is actually
      effective, not incidentally blocked by a NetworkPolicy or ingress
      restriction on who can reach the API server unauthenticated at all.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings", "clusterrolebindings"]
  validations:
    - expression: |-
        !has(object.subjects) || !object.subjects.exists(s,
          has(s.name) && (s.name == "system:anonymous" || s.name == "system:unauthenticated")
        )
      message: "Binding grants a role to system:anonymous or the system:unauthenticated group."
