apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: rbac.no-wildcard-rules
  annotations:
    audit.k8s-auditor.io/title: "RBAC rule grants wildcard verbs, resources, or apiGroups"
    audit.k8s-auditor.io/severity: high
    audit.k8s-auditor.io/category: rbac
    audit.k8s-auditor.io/remediation: >-
      Replace wildcard ("*") verbs, resources, or apiGroups with the exact
      set the subject actually needs. Wildcards violate least privilege and
      typically grant far more than intended (e.g. "*" resources includes
      secrets).
    audit.k8s-auditor.io/cis: "5.1.3"
    audit.k8s-auditor.io/verification-steps: >-
      1. Check which specific verbs/resources/apiGroups the wildcard
      actually expands to on this cluster — a wildcard resources grant on a
      Role scoped to one narrow, non-sensitive apiGroup is materially
      narrower in practice than it looks syntactically. 2. Cross-reference
      with other rbac-analyzer findings for the same subject (escalation
      verbs, broad Secrets access) — a wildcard combined with either of
      those is a much higher-priority combination than the wildcard alone.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["roles", "clusterroles"]
  validations:
    - expression: |-
        !has(object.rules) || object.rules.all(r,
          !(has(r.verbs) && r.verbs.exists(v, v == "*")) &&
          !(has(r.resources) && r.resources.exists(x, x == "*")) &&
          !(has(r.apiGroups) && r.apiGroups.exists(g, g == "*"))
        )
      message: "Role/ClusterRole contains a rule with a wildcard (\"*\") verb, resource, or apiGroup."
