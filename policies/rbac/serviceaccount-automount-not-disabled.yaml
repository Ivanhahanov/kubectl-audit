apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: rbac.serviceaccount-automount-not-disabled
  annotations:
    audit.k8s-auditor.io/title: "ServiceAccount does not explicitly disable token automount"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: rbac
    audit.k8s-auditor.io/remediation: >-
      Set automountServiceAccountToken: false on the ServiceAccount, unless
      pods using it genuinely need to call the Kubernetes API — in which case
      set it to true explicitly (not just leave it unset) so the choice is
      documented rather than defaulted into.
    audit.k8s-auditor.io/cis: "5.1.6"
    audit.k8s-auditor.io/verification-steps: >-
      1. Check whether any Pod using this ServiceAccount actually calls the
      Kubernetes API (grep the application/sidecar images, or ask the owning
      team) — if not, this is a pure, low-risk fix. 2. This check flags every
      ServiceAccount that doesn't set the field explicitly, regardless of
      whether it's actually bound to any RBAC permissions — see
      rbac-analyzer.automount-with-sensitive-access for the narrower,
      higher-urgency case where the ServiceAccount also has sensitive access
      bound to it; that one is the more actionable of the two if both fire on
      the same ServiceAccount.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["serviceaccounts"]
  validations:
    - expression: |-
        has(object.automountServiceAccountToken) && object.automountServiceAccountToken == false
      message: "ServiceAccount does not set automountServiceAccountToken: false — every Pod using it gets an API token automounted by default."
