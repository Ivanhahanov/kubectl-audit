apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: rbac.no-csr-approval-access
  annotations:
    audit.k8s-auditor.io/title: "Role/ClusterRole grants access to the certificatesigningrequests/approval sub-resource"
    audit.k8s-auditor.io/severity: high
    audit.k8s-auditor.io/category: rbac
    audit.k8s-auditor.io/remediation: >-
      Remove update/patch access to certificatesigningrequests/approval
      unless the subject is a trusted, audited certificate-approval
      controller. It allows approving arbitrary CertificateSigningRequests,
      which mints new, trusted client credentials for the cluster.
    audit.k8s-auditor.io/cis: "5.1.11"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["roles", "clusterroles"]
  validations:
    - expression: |-
        !has(object.rules) || object.rules.all(r,
          !(
            has(r.apiGroups) && (r.apiGroups.exists(g, g == "certificates.k8s.io") || r.apiGroups.exists(g, g == "*")) &&
            has(r.resources) && (r.resources.exists(x, x == "certificatesigningrequests/approval") || r.resources.exists(x, x == "*")) &&
            has(r.verbs) && (r.verbs.exists(v, v in ["update", "patch"]) || r.verbs.exists(v, v == "*"))
          )
        )
      message: "Role/ClusterRole grants update/patch access on the certificatesigningrequests/approval sub-resource."
