apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: calico.felixconfiguration-default-endpoint-to-host-action-permissive
  annotations:
    audit.k8s-auditor.io/title: "Calico allows workload traffic to reach the host by default"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: calico
    audit.k8s-auditor.io/remediation: >-
      Remove spec.defaultEndpointToHostAction (or set it back to "Drop",
      the default) on the FelixConfiguration. Verified directly against
      Felix's own source (felixconfig.go, DefaultEndpointToHostAction
      field comment): "By default, Calico blocks traffic from workload
      endpoints to the host itself with an iptables 'DROP' action... Use
      ACCEPT to unconditionally accept packets from workloads after
      processing, or RETURN to accept packets from workloads that pass
      through untouched." Setting this to Accept or Return is an explicit
      opt-out of Calico's own default workload-to-host traffic block.
    audit.k8s-auditor.io/verification-steps: >-
      1. Check whether this was set deliberately for a specific operational
      reason (e.g. a monitoring agent needing to reach a host-local
      service) vs. a blanket, unreviewed override. 2. Confirm the
      practical exposure: what host-local services/ports are actually
      listening and reachable if workload-to-host traffic is allowed — a
      host with no sensitive local listeners has lower practical risk
      despite the permissive setting.
  # FelixConfiguration is a cluster-wide singleton, same shape as the
  # existing wireguard-disabled check. Felix's own accepted-value CRD
  # pattern is case-insensitive (^(?i)(Drop|Accept|Return)?$), hence the
  # (?i) regex below rather than an exact string match.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["crd.projectcalico.org"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["felixconfigurations"]
  validations:
    - expression: |-
        !has(object.spec.defaultEndpointToHostAction) ||
        !object.spec.defaultEndpointToHostAction.matches(r'(?i)^(accept|return)$')
      message: >-
        FelixConfiguration.spec.defaultEndpointToHostAction is set to
        Accept or Return — workload traffic to the host itself is allowed
        by default instead of being dropped.
