apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: calico.felixconfiguration-allow-vxlan-packets-from-workloads
  annotations:
    audit.k8s-auditor.io/title: "Calico allows VXLAN-encapsulated traffic from workloads, a known NetworkPolicy-bypass technique"
    audit.k8s-auditor.io/severity: high
    audit.k8s-auditor.io/category: calico
    audit.k8s-auditor.io/remediation: >-
      Remove spec.allowVXLANPacketsFromWorkloads (or set it back to
      false, the default) on the FelixConfiguration. Verified directly
      against Felix's own source (felixconfig.go,
      AllowVXLANPacketsFromWorkloads field comment): "controls whether
      Felix will add a rule to drop VXLAN encapsulated traffic from
      workloads." Same bypass shape as
      calico.felixconfiguration-allow-ipip-packets-from-workloads: a
      malicious or compromised workload can encapsulate traffic in VXLAN
      to smuggle it past NetworkPolicy enforcement that only inspects the
      inner, unencapsulated packet.
    audit.k8s-auditor.io/verification-steps: >-
      1. Check whether this cluster actually runs VXLAN encapsulation mode
      at all (the IPPool's encapsulation setting) — if it doesn't, this
      flag has no practical effect regardless of its value. 2. If VXLAN is
      genuinely in use, confirm whether any workload could plausibly craft
      raw VXLAN-encapsulated packets (needs NET_RAW or a similar
      capability) — a real bypass technique, but one that needs a specific
      capability on the attacker's side, not something any pod can do by
      default.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["crd.projectcalico.org"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["felixconfigurations"]
  validations:
    - expression: |-
        !has(object.spec.allowVXLANPacketsFromWorkloads) ||
        object.spec.allowVXLANPacketsFromWorkloads == false
      message: >-
        FelixConfiguration.spec.allowVXLANPacketsFromWorkloads is true —
        workloads can send VXLAN-encapsulated traffic that bypasses
        NetworkPolicy enforcement on the inner packet.
