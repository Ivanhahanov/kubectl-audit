apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: victoriametrics.vmauth-select-all-by-default-enabled
  annotations:
    audit.k8s-auditor.io/title: "VMAuth trusts every VMUser in the cluster, not just an explicit selector"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: victoriametrics
    audit.k8s-auditor.io/remediation: >-
      Remove selectAllByDefault: true and scope userSelector/
      userNamespaceSelector to the specific VMUsers this VMAuth should
      trust. VictoriaMetrics operator's own doc comment
      (api/operator/v1beta1/vmauth_types.go): "changes default behavior
      for empty CRD selectors, such userSelector. with
      selectAllByDefault: true and empty userSelector and
      userNamespaceSelector Operator selects all exist users." An
      explicit opt-out of namespace/label-scoped trust boundaries — the
      same shape as vault.auth-allowed-namespaces-wildcard. Weaker-sourced
      than most checks in this repo (no explicit "insecure" warning from
      VictoriaMetrics itself, same tier as istio.gateway-weak-tls-version).
    audit.k8s-auditor.io/verification-steps: >-
      1. Weaker-sourced check per its own annotation — check whether this VMAuth
      genuinely needs to trust every VMUser (e.g. a single-tenant, platform-team-only
      cluster) vs. a multi-tenant one where scoping matters more. 2. Check what access
      each trusted VMUser actually has configured — broad trust combined with broad per-
      user permissions is the highest-priority combination.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["operator.victoriametrics.com"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["vmauths"]
  validations:
    - expression: |-
        !has(object.spec.selectAllByDefault) || object.spec.selectAllByDefault == false
      message: >-
        VMAuth.spec.selectAllByDefault is true — every VMUser in the
        cluster is trusted by this VMAuth instead of only VMUsers
        matching an explicit userSelector/userNamespaceSelector.
