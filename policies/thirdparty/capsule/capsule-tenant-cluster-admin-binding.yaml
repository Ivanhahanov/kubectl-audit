apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: multitenancy.capsule-tenant-cluster-admin-binding
  annotations:
    audit.k8s-auditor.io/title: "Capsule Tenant grants the cluster-admin ClusterRole to tenant subjects"
    audit.k8s-auditor.io/severity: high
    audit.k8s-auditor.io/category: multitenancy
    audit.k8s-auditor.io/remediation: >-
      Remove the cluster-admin entry from spec.additionalRoleBindings and
      bind tenant owners to a narrower role scoped to what they actually
      need. A tenant subject with cluster-admin defeats tenant isolation
      entirely — the same concern as rbac.no-cluster-admin-binding, applied
      to bindings Capsule synchronizes for a tenant.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["capsule.clastix.io"]
        # "*" instead of a pinned version — matches the Tenant object
        # regardless of which Capsule release the cluster runs. Verified
        # (2026-08, against api/v1beta1/tenant_types.go and
        # api/v1beta2/tenant_types.go in projectcapsule/capsule):
        # spec.additionalRoleBindings[].clusterRoleName has the identical
        # json path in both shipped versions (v1beta1, v1beta2), so this
        # check is safe across both — no version-specific gap like
        # capsule-tenant-no-psa-enforcement.
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["tenants"]
  validations:
    - expression: |-
        !has(object.spec.additionalRoleBindings) ||
        object.spec.additionalRoleBindings.all(b,
          !has(b.clusterRoleName) || b.clusterRoleName != "cluster-admin"
        )
      message: "Tenant's spec.additionalRoleBindings grants the cluster-admin ClusterRole to tenant subjects, defeating tenant isolation."
