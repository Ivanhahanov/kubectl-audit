apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: multitenancy.capsule-tenant-no-resource-quota
  annotations:
    audit.k8s-auditor.io/title: "Capsule Tenant has no resource quota ceiling"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: multitenancy
    audit.k8s-auditor.io/remediation: >-
      Set spec.resourceQuotas.items on the Tenant so Capsule provisions a
      ResourceQuota in every namespace it creates for this tenant, and make
      sure the combined items actually bound CPU (requests.cpu/limits.cpu),
      memory (requests.memory/limits.memory), pod count (pods), and
      PersistentVolumeClaim count (persistentvolumeclaims) — not just any
      one of them. A quota that only limits, say, CPU still leaves the
      tenant able to consume unbounded memory or create unbounded pods/PVCs.
    audit.k8s-auditor.io/verification-steps: >-
      1. Check whether the tenant's namespaces already have a ResourceQuota applied
      through some other mechanism outside this Tenant field. 2. Assess actual cluster
      capacity risk: a tenant on a cluster with abundant headroom and few tenants has
      lower urgency than one on a tightly-packed, many-tenant shared cluster. 3. If
      only some of CPU/memory/pods/PVCs are bounded, prioritize by which unbounded
      dimension the cluster actually has the least headroom on.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["capsule.clastix.io"]
        # "*" instead of a pinned version — matches the Tenant object
        # regardless of which Capsule release the cluster runs. Verified
        # (2026-08, against api/v1beta1/tenant_types.go and
        # api/v1beta2/tenant_types.go in projectcapsule/capsule):
        # spec.resourceQuotas.items has the identical json path in both
        # shipped versions (v1beta1, v1beta2), so this check is safe across
        # both — no version-specific gap like capsule-tenant-no-psa-enforcement.
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["tenants"]
  validations:
    - expression: |-
        has(object.spec.resourceQuotas) && has(object.spec.resourceQuotas.items) &&
        size(object.spec.resourceQuotas.items) > 0
      message: "Tenant does not set spec.resourceQuotas.items, so its namespaces have no resource quota ceiling — this tenant can consume unbounded cluster resources."
    - expression: |-
        !has(object.spec.resourceQuotas) || !has(object.spec.resourceQuotas.items) || size(object.spec.resourceQuotas.items) == 0 ||
        (
          object.spec.resourceQuotas.items.exists(i, has(i.hard) && ("requests.cpu" in i.hard || "limits.cpu" in i.hard || "cpu" in i.hard)) &&
          object.spec.resourceQuotas.items.exists(i, has(i.hard) && ("requests.memory" in i.hard || "limits.memory" in i.hard || "memory" in i.hard)) &&
          object.spec.resourceQuotas.items.exists(i, has(i.hard) && ("pods" in i.hard)) &&
          object.spec.resourceQuotas.items.exists(i, has(i.hard) && ("persistentvolumeclaims" in i.hard || "requests.storage" in i.hard))
        )
      message: "Tenant's spec.resourceQuotas.items don't together bound CPU, memory, pod count, and PersistentVolumeClaim count — only some dimensions are capped, so the tenant can still consume unbounded amounts of whichever one is missing."
