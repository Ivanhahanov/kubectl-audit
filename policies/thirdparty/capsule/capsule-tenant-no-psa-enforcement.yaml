apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: multitenancy.capsule-tenant-no-psa-enforcement
  annotations:
    audit.k8s-auditor.io/title: "Capsule Tenant does not pin Pod Security Standards enforcement"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: multitenancy
    audit.k8s-auditor.io/remediation: >-
      Add a pod-security.kubernetes.io/enforce label to
      spec.namespaceOptions.requiredMetadata.labels on the Tenant, so every
      namespace Capsule creates for it is required to carry Pod Security
      Admission enforcement (same underlying gap as
      psa-analyzer.no-active-enforcement, pinned at the tenant level so
      tenant owners can't remove it from namespaces they self-service).
    audit.k8s-auditor.io/verification-steps: >-
      1. Per this policy's own annotation, a Tenant using the older v1beta1 API shape
      will ALWAYS fail this check even if PSA is enforced some other way — check the
      Tenant's actual API version and whether Pod Security enforcement is achieved
      through a different mechanism (a namespace label applied directly, a cluster-wide
      --admission-control-config-file) before treating this as a confirmed gap. 2.
      Cross-reference with actual psa-analyzer.no-active-enforcement findings on this
      tenant's real namespaces to see if the gap is realized in practice.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["capsule.clastix.io"]
        # "*" instead of a pinned version — matches the Tenant object
        # regardless of which Capsule release the cluster runs. Verified
        # (2026-08, against api/v1beta1/namespace_options.go and
        # api/v1beta2/namespace_options.go in projectcapsule/capsule):
        # spec.namespaceOptions.requiredMetadata was introduced in v1beta2
        # and has no v1beta1 equivalent, so a Tenant that predates v1beta2
        # will ALWAYS fail this check — correctly, since the mechanism this
        # check looks for genuinely doesn't exist on that Tenant, not a
        # false positive. See docs/compliance.md's Capsule section.
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["tenants"]
  validations:
    - expression: |-
        has(object.spec.namespaceOptions) &&
        has(object.spec.namespaceOptions.requiredMetadata) &&
        has(object.spec.namespaceOptions.requiredMetadata.labels) &&
        ('pod-security.kubernetes.io/enforce' in object.spec.namespaceOptions.requiredMetadata.labels)
      message: "Tenant does not require the pod-security.kubernetes.io/enforce label in spec.namespaceOptions.requiredMetadata.labels, so its namespaces have no baked-in Pod Security Standards enforcement pinned by Capsule."
