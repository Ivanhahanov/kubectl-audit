apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: istio.authorization-policy-wildcard-path
  annotations:
    audit.k8s-auditor.io/title: "[ALPHA] AuthorizationPolicy ALLOW rule grants every HTTP path"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: istio
    audit.k8s-auditor.io/remediation: >-
      Replace the wildcard in to.operation.paths with the specific path(s)
      this caller actually needs. An L7 path/method restriction is only
      enforced by the sidecar/ztunnel+waypoint data plane — in Istio
      ambient mode, "to" (L7) rules require a waypoint proxy deployed for
      the target workload/namespace, or they're not enforced at all; see
      the Scope section for this caveat.
    audit.k8s-auditor.io/verification-steps: >-
      1. Confirm this is genuinely a wildcard and not a legitimately narrow prefix that
      happens to end in a common pattern. 2. Per this policy's own annotation, in Istio
      ambient mode this L7 path restriction is only enforced when a waypoint proxy is
      deployed for the target — confirm one exists, or this control may not be enforced
      at all regardless of what the YAML says (see docs/istio.md's Scope note).
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["security.istio.io"]
        # "*" instead of pinned versions. Verified (2026-08, against
        # istio/api's security/v1/authorization_policy_alias.gen.go):
        # security.istio.io/v1's AuthorizationPolicy is a literal Go type
        # alias of v1beta1's — `type AuthorizationPolicy = v1beta1.AuthorizationPolicy`
        # — zero field differences between the two versions Istio has ever
        # shipped for this group, so this check is safe regardless of which
        # one the cluster serves. No v1alpha1 exists for security.istio.io.
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["authorizationpolicies"]
  validations:
    - expression: |-
        (has(object.spec.action) && object.spec.action != "ALLOW") ||
        !has(object.spec.rules) ||
        !object.spec.rules.exists(r,
          has(r.to) && r.to.exists(t,
            has(t.operation) && has(t.operation.paths) &&
            t.operation.paths.exists(p, p == "*" || p == "/*")
          )
        )
      message: "[ALPHA] AuthorizationPolicy ALLOW rule's to.operation.paths includes a wildcard (\"*\" or \"/*\"), granting access to every HTTP path on the selected workload(s) instead of specific endpoints."
