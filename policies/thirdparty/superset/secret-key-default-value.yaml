apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: superset.secret-key-default-value
  annotations:
    audit.k8s-auditor.io/title: "Superset SECRET_KEY is left at the well-known example value"
    audit.k8s-auditor.io/severity: critical
    audit.k8s-auditor.io/category: superset
    audit.k8s-auditor.io/remediation: >-
      Generate a real random SUPERSET_SECRET_KEY and replace this Secret's
      value — never the literal example string from Superset's own docs.
      Verified directly against Superset's own source: superset/constants.py
      defines CHANGE_ME_SECRET_KEY = "CHANGE_ME_TO_A_COMPLEX_RANDOM_SECRET",
      and superset/config.py falls back to it: SECRET_KEY =
      os.environ.get("SUPERSET_SECRET_KEY") or CHANGE_ME_SECRET_KEY. This
      is CVE-2023-27524: a known/default SECRET_KEY lets an attacker forge
      a valid session cookie, bypass authentication, and reach SQL Lab —
      remote code execution in some configurations. The official
      apache/superset Helm chart's own values.yaml shows this exact string
      as its extraSecretEnv.SUPERSET_SECRET_KEY documentation example, a
      real, plausible copy-paste trap.
    audit.k8s-auditor.io/verification-steps: >-
      1. This is CVE-2023-27524, matched via an exact literal comparison
      (see this policy's own annotation) — false positives are essentially
      impossible; if it fired, treat as an active, exploitable
      authentication bypass, not a routine hygiene finding. 2. Confirm the
      live Secret still holds this exact value (`kubectl get secret <name>
      -o jsonpath='{.data.SUPERSET_SECRET_KEY}'`) and check whether this
      Superset instance is internet-reachable — if so, treat rotation as an
      emergency, not routine remediation.
  # Requires --read-secret-values (see docs/secrets-mode.md): the official
  # chart's templates/secret-superset-config.yaml renders extraSecretEnv
  # entries directly as individual Secret data keys, verified against the
  # chart's own templates/secret-env.yaml — so SUPERSET_SECRET_KEY is a
  # single, exact, checkable key/value pair, not embedded inside the
  # opaque superset_config.py blob (which this engine structurally cannot
  # inspect — see docs/secrets-mode.md's base64-comparison-only design).
  # Broad-match-any-Secret + narrow-value-condition, same pattern as
  # kyverno.admission-controller-force-failure-policy-ignore's broad
  # Deployment match.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  validations:
    - expression: |-
        !has(object.data) || !('SUPERSET_SECRET_KEY' in object.data) ||
        object.data['SUPERSET_SECRET_KEY'] != 'Q0hBTkdFX01FX1RPX0FfQ09NUExFWF9SQU5ET01fU0VDUkVU'
      message: "This Secret's SUPERSET_SECRET_KEY is still the well-known example value from Superset's own source/docs (CVE-2023-27524) — session cookies can be forged, bypassing authentication."
