apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: metabase.encryption-secret-key-missing
  annotations:
    audit.k8s-auditor.io/title: "Metabase has no MB_ENCRYPTION_SECRET_KEY set — database connection credentials stored unencrypted"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: metabase
    audit.k8s-auditor.io/remediation: >-
      Set MB_ENCRYPTION_SECRET_KEY (directly, or via valueFrom.secretKeyRef
      — this check only looks for the env var name being present, not its
      value, so either wiring style satisfies it) so Metabase encrypts the
      data-source connection details it stores in its own application
      database. Weaker-sourced than most checks in this repo: Metabase's
      own docs on encrypting details at rest use "can" rather than an
      imperative "must"/"always" — this is a documented option, not a
      documented requirement, so treat this finding as lower-confidence
      than most in this repo (same tier as istio.gateway-weak-tls-version).
      The underlying risk (every database password/connection string
      Metabase manages, stored in cleartext in Metabase's own metadata DB)
      has no other mitigation in this repo currently.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: |-
        !has(object.spec.template) || !has(object.spec.template.spec.containers) ||
        object.spec.template.spec.containers.all(c,
          !has(c.image) || !c.image.startsWith('metabase/metabase') ||
          (has(c.env) && c.env.exists(e, e.name == 'MB_ENCRYPTION_SECRET_KEY'))
        )
      message: "This Metabase container has no MB_ENCRYPTION_SECRET_KEY env var — data-source connection details Metabase stores in its own application database are not encrypted at rest."
