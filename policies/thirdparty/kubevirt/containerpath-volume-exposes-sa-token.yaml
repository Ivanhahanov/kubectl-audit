apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubevirt.containerpath-volume-exposes-sa-token
  annotations:
    audit.k8s-auditor.io/title: "VM's containerPath volume exposes the pod's own Kubernetes ServiceAccount token to the guest"
    audit.k8s-auditor.io/severity: high
    audit.k8s-auditor.io/category: kubevirt
    audit.k8s-auditor.io/remediation: >-
      Do not point a containerPath volume's path at
      /var/run/secrets/kubernetes.io/serviceaccount — that hands the
      untrusted guest OS the virt-launcher pod's own Kubernetes API
      credentials. KubeVirt's own docs
      (docs/storage/containerpath_volumes.md, "Security considerations"):
      "VMs gain access to any files within the specified container path
      — only expose paths containing data intended for VM consumption."
      The documented, intended use of this feature is exposing a
      purpose-provisioned external-cloud-identity token (e.g. AWS IRSA at
      /var/run/secrets/eks.amazonaws.com/... or Azure workload identity
      at /var/run/secrets/azure/tokens/...) — this check only flags the
      pod's own default Kubernetes API token path, not containerPath
      usage in general.
    audit.k8s-auditor.io/verification-steps: >-
      1. Confirm this VM genuinely doesn't need the pod's own Kubernetes API token
      inside the guest — the documented, intended use of containerPath is a DIFFERENT
      purpose-provisioned token (AWS IRSA, Azure workload identity), so check whether
      this looks like a copy-paste of an intended-external-token pattern that
      accidentally pointed at the wrong path. 2. Check what permissions the pod's
      ServiceAccount actually has (kubectl get sa <name> -o yaml, then check bound
      Roles) — a token with near-zero permissions exposed to the guest is lower risk
      than one with broad cluster access.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kubevirt.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["virtualmachines", "virtualmachineinstances"]
  validations:
    - expression: |-
        (!has(object.spec.volumes) || !object.spec.volumes.exists(v,
          has(v.containerPath) &&
          v.containerPath.path.startsWith('/var/run/secrets/kubernetes.io/serviceaccount')
        )) &&
        (!has(object.spec.template) || !has(object.spec.template.spec) ||
         !has(object.spec.template.spec.volumes) ||
         !object.spec.template.spec.volumes.exists(v,
           has(v.containerPath) &&
           v.containerPath.path.startsWith('/var/run/secrets/kubernetes.io/serviceaccount')
         ))
      message: "This VM has a containerPath volume pointed at /var/run/secrets/kubernetes.io/serviceaccount — it exposes the virt-launcher pod's own Kubernetes API ServiceAccount token to the untrusted guest OS."
