apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: secrets.configmap-no-embedded-credentials
  annotations:
    audit.k8s-auditor.io/title: "ConfigMap appears to contain an embedded credential"
    audit.k8s-auditor.io/severity: high
    audit.k8s-auditor.io/category: secrets
    audit.k8s-auditor.io/remediation: >-
      Move this value to a Secret (ideally backed by an external secrets
      manager, not a bare Kubernetes Secret) instead of a ConfigMap.
      ConfigMaps are not encrypted at rest by default and are readable by
      anyone with get/list access to them.
    audit.k8s-auditor.io/verification-steps: >-
      1. Manually inspect the flagged key's actual value (`kubectl get
      configmap <name> -o yaml`) to rule out a false positive — the PEM-
      header pattern also matches a legitimate PUBLIC key or certificate
      stored in a ConfigMap (which is fine there); check whether the header
      literally says PRIVATE KEY vs. PUBLIC KEY/CERTIFICATE. 2. For the
      AWS-access-key-ID pattern, confirm whether a paired secret access key
      is reachable anywhere nearby — an access key ID alone has limited
      standalone value, but its presence is still worth investigating (at
      minimum, IAM policy/permission enumeration for that key).
  # No CIS control: the CIS Kubernetes Benchmark doesn't have a dedicated
  # ConfigMap-vs-Secret content check. Grounded instead in NIST SP 800-190
  # §4.1.4 "Embedded clear text secrets in image/deployment artifacts".
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["configmaps"]
  validations:
    # Deliberately conservative: only two high-confidence, low-false-positive
    # patterns (a PEM private key header, and the AWS access key ID format).
    # A generic "password=" / "token:" heuristic was considered and dropped —
    # too false-positive-prone for a bundled, always-on check across
    # arbitrary orgs' naming conventions. Write a custom policy (see
    # docs/custom-checks.md) if you want stricter, org-tuned patterns.
    - expression: |-
        !has(object.data) || object.data.all(k,
          !object.data[k].matches('-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----')
        )
      message: "ConfigMap data contains what looks like a PEM private key block."
    - expression: |-
        !has(object.data) || object.data.all(k,
          !object.data[k].matches('AKIA[0-9A-Z]{16}')
        )
      message: "ConfigMap data contains what looks like an AWS access key ID (AKIA...)."
