apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: secrets.legacy-serviceaccount-token
  annotations:
    audit.k8s-auditor.io/title: "Legacy long-lived ServiceAccount token Secret"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: rbac
    audit.k8s-auditor.io/remediation: >-
      Delete this Secret and switch whatever consumes it to a projected
      volume (serviceAccountToken source) instead — a short-lived,
      audience-scoped token minted per-Pod, not a static credential that
      never expires and keeps working even after the Pod is gone. Kubernetes
      stopped auto-creating these Secrets for new ServiceAccounts since
      v1.24; one existing here means either an old cluster upgraded in
      place, or something created it explicitly.
    audit.k8s-auditor.io/verification-steps: >-
      1. Check whether anything actually still reads this Secret
      (`kubectl get pods -A -o json | jq` for volumes/env referencing it, or
      search Deployment/CronJob manifests) — an unused leftover from a pre-
      v1.24 cluster is lower urgency than one actively mounted. 2. If in
      use, confirm the consuming workload can be migrated to a projected
      serviceAccountToken volume before deleting this Secret, not after.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  validations:
    - expression: |-
        object.type != "kubernetes.io/service-account-token"
      message: "Secret is a legacy long-lived ServiceAccount token (type: kubernetes.io/service-account-token) — never expires on its own, unlike a projected serviceAccountToken volume."
