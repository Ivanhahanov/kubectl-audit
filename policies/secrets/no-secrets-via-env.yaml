apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: secrets.no-secrets-via-env
  annotations:
    audit.k8s-auditor.io/title: "Container sources Secret data via environment variables instead of a mounted volume"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: secrets
    audit.k8s-auditor.io/remediation: >-
      Mount the Secret as a volume and read it from the filesystem instead
      of env/envFrom. Environment variables are more likely to leak: they
      show up in `kubectl describe pod`/crash dumps, are inherited by every
      child process, and commonly get logged by application error handlers
      that dump the environment.
    audit.k8s-auditor.io/cis: "5.4.1"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  validations:
    - expression: |-
        (has(object.spec.containers) ? object.spec.containers
          : (has(object.spec.template) && has(object.spec.template.spec) && has(object.spec.template.spec.containers)) ? object.spec.template.spec.containers
          : (has(object.spec.jobTemplate) && has(object.spec.jobTemplate.spec) && has(object.spec.jobTemplate.spec.template) && has(object.spec.jobTemplate.spec.template.spec) && has(object.spec.jobTemplate.spec.template.spec.containers)) ? object.spec.jobTemplate.spec.template.spec.containers
          : []).all(c,
            (!has(c.env) || c.env.all(e, !(has(e.valueFrom) && has(e.valueFrom.secretKeyRef)))) &&
            (!has(c.envFrom) || c.envFrom.all(ef, !has(ef.secretRef)))
          )
      message: "Container reads Secret data via env/envFrom (secretKeyRef or secretRef) instead of a mounted volume."
