apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: secrets.known-weak-placeholder-value
  annotations:
    audit.k8s-auditor.io/title: "Secret value is a well-known weak/placeholder literal, not a real credential"
    audit.k8s-auditor.io/severity: critical
    audit.k8s-auditor.io/category: secrets
    audit.k8s-auditor.io/remediation: >-
      Replace this value with a real, randomly-generated credential.
      NIST SP 800-63B §5.1.1.2 (Memorized Secret Verifiers) directs
      verifiers to reject secrets found in "previous breach corpuses,"
      dictionary words, and "context-specific words" — this check applies
      that same principle at the Kubernetes-object level: a Secret whose
      value is literally one of a small set of self-evidently
      non-random, commonly-used placeholder strings (documentation
      copy-paste examples, default keystore passwords, or classic
      weak-password-list entries) is definitionally not a secret,
      regardless of which product it belongs to. "changeit" is Java's own
      documented default keystore/truststore password (`keytool`'s own
      manual); the rest are among the most common human-chosen
      passwords/placeholder tokens observed across published weak-password
      and breach-corpus research. Only checks a short, deliberately narrow
      list of exact, self-evidently-non-random values — not a general
      weak-password heuristic — to keep false-positive risk at essentially
      zero: the odds of a genuinely random secret coincidentally equaling
      one of these short literal strings are astronomically low.
    audit.k8s-auditor.io/verification-steps: >-
      1. This check only matches an EXACT literal value from a short,
      deliberately narrow list (see this policy's own annotation above for
      the full rationale) — false positives are essentially impossible. If
      it fired, decode and confirm directly (kubectl get secret <name> -o
      jsonpath='{.data.<key>}' | base64 -d) that the live value really is
      still the flagged placeholder. 2. If confirmed, treat as an active
      credential-compromise-in-progress, not just a hygiene finding: rotate
      immediately, and check auth/audit logs for whether this value has
      already been used to authenticate anywhere since deployment.
  # Requires --read-secret-values (see docs/secrets-mode.md). Restricted to
  # type: Opaque (or type absent, which defaults to Opaque per the
  # Kubernetes API) and kubernetes.io/basic-auth (a real built-in type
  # whose data is literally username/password, the same flat-credential
  # shape as Opaque) — kubernetes.io/tls, dockerconfigjson,
  # service-account-token, and other typed Secrets have structurally
  # different, non-credential data shapes (cert/key PEM blocks, JSON,
  # tokens) where this check doesn't apply and would only add
  # false-positive risk. basic-auth's inclusion, and the stringData check
  # below, were both added after an adversarial stress-test pass found
  # this check missed them in its first version. Checks every key's
  # value, not a specific key name, so it complements (rather than
  # duplicates) product-specific checks like
  # superset.secret-key-default-value, which target one exact known value
  # under one exact known key.
  #
  # Checks both .data (base64, hence the encoded literals below) and
  # .stringData (plaintext) — unlike a real admission request, a static
  # manifest this tool loads via -f keeps stringData verbatim (nothing
  # merges it into .data the way the API server would on a real create),
  # so a placeholder value authored via stringData needs its own,
  # plaintext comparison to be caught at all.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  validations:
    - expression: |-
        (has(object.type) && object.type != 'Opaque' && object.type != 'kubernetes.io/basic-auth') ||
        (
          (!has(object.data) || !object.data.exists(k, object.data[k] in [
            'Y2hhbmdlbWU=', 'Y2hhbmdlaXQ=', 'cGFzc3dvcmQ=', 'YWRtaW4=',
            'c2VjcmV0', 'Z3Vlc3Q=', 'cm9vdA==', 'MTIzNDU2', 'bGV0bWVpbg==',
            'cXdlcnR5'
          ])) &&
          (!has(object.stringData) || !object.stringData.exists(k, object.stringData[k] in [
            'changeme', 'changeit', 'password', 'admin', 'secret', 'guest',
            'root', '123456', 'letmein', 'qwerty'
          ]))
        )
      message: >-
        This Secret's data contains a value equal to a well-known
        weak/placeholder literal (e.g. "changeme", "changeit", "password",
        "admin", "secret", "guest", "root", "123456", "letmein", "qwerty")
        — this is not a real credential.
