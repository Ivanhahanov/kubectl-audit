apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: workload.no-privileged-containers
  annotations:
    audit.k8s-auditor.io/title: "Privileged containers and privilege escalation"
    audit.k8s-auditor.io/severity: critical
    audit.k8s-auditor.io/category: workload-security
    audit.k8s-auditor.io/remediation: >-
      Remove securityContext.privileged (or set it to false) and set
      securityContext.allowPrivilegeEscalation to false on every container.
      Privileged containers have near-unrestricted access to the host.
    audit.k8s-auditor.io/cis: "5.2.2,5.2.6"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  validations:
    - expression: |-
        (has(object.spec.containers) ? object.spec.containers
          : (has(object.spec.template) && has(object.spec.template.spec) && has(object.spec.template.spec.containers)) ? object.spec.template.spec.containers
          : (has(object.spec.jobTemplate) && has(object.spec.jobTemplate.spec) && has(object.spec.jobTemplate.spec.template) && has(object.spec.jobTemplate.spec.template.spec) && has(object.spec.jobTemplate.spec.template.spec.containers)) ? object.spec.jobTemplate.spec.template.spec.containers
          : []).all(c, !(has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged == true))
      message: "Container runs with securityContext.privileged=true, granting near-root access to the host."
    - expression: |-
        (has(object.spec.containers) ? object.spec.containers
          : (has(object.spec.template) && has(object.spec.template.spec) && has(object.spec.template.spec.containers)) ? object.spec.template.spec.containers
          : (has(object.spec.jobTemplate) && has(object.spec.jobTemplate.spec) && has(object.spec.jobTemplate.spec.template) && has(object.spec.jobTemplate.spec.template.spec) && has(object.spec.jobTemplate.spec.template.spec.containers)) ? object.spec.jobTemplate.spec.template.spec.containers
          : []).all(c, !(has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == true))
      message: "Container allows privilege escalation (securityContext.allowPrivilegeEscalation must be false)."
