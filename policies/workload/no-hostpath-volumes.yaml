apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: workload.no-hostpath-volumes
  annotations:
    audit.k8s-auditor.io/title: "hostPath volume mounts"
    audit.k8s-auditor.io/severity: high
    audit.k8s-auditor.io/category: workload-security
    audit.k8s-auditor.io/remediation: >-
      Avoid hostPath volumes; use a PersistentVolumeClaim, ConfigMap, or
      Secret instead. hostPath exposes the node's filesystem to the
      container and can be used to escape to the host.
    audit.k8s-auditor.io/cis: "5.2.11"
    audit.k8s-auditor.io/verification-steps: >-
      1. Check the Detected Components table for a legitimate infrastructure
      reason (a log-shipping DaemonSet mounting /var/log, a CSI node
      plugin). 2. For an application workload, check exactly which host path
      is mounted and whether it's read-only — a read-only mount of a narrow,
      non-sensitive path is materially lower risk than a writable mount of
      something like / or /var/run/docker.sock (the latter is a well-known,
      immediate container-escape path — treat as critical if seen regardless
      of the severity label above).
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  validations:
    - expression: |-
        (has(object.spec.volumes) ? object.spec.volumes
          : (has(object.spec.template) && has(object.spec.template.spec) && has(object.spec.template.spec.volumes)) ? object.spec.template.spec.volumes
          : (has(object.spec.jobTemplate) && has(object.spec.jobTemplate.spec) && has(object.spec.jobTemplate.spec.template) && has(object.spec.jobTemplate.spec.template.spec) && has(object.spec.jobTemplate.spec.template.spec.volumes)) ? object.spec.jobTemplate.spec.template.spec.volumes
          : []).all(v, !has(v.hostPath))
      message: "Pod spec mounts a hostPath volume, exposing the node's filesystem to the container."
