apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: workload.no-default-namespace
  annotations:
    audit.k8s-auditor.io/title: "Workload is deployed in the \"default\" namespace"
    audit.k8s-auditor.io/severity: low
    audit.k8s-auditor.io/category: workload-security
    audit.k8s-auditor.io/remediation: >-
      Create a dedicated, purpose-named namespace for this workload instead
      of using "default" — it makes RBAC scoping, NetworkPolicy defaults,
      resource quotas, and ownership all meaningfully harder to reason
      about when every unrelated workload shares one namespace.
    audit.k8s-auditor.io/cis: "5.6.4"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  validations:
    # Only an *explicit* "default" fails, not an unset/empty namespace: a
    # manifest with no metadata.namespace at all (common in Helm/Kustomize
    # templates that rely on `-n`/`.Release.Namespace` at apply time rather
    # than hardcoding one) isn't necessarily headed for "default" — flagging
    # it would be a guess this tool can't actually back up from the
    # manifest alone.
    - expression: |-
        !has(object.metadata.namespace) || object.metadata.namespace != "default"
      message: "Workload's metadata.namespace is explicitly set to \"default\"."
