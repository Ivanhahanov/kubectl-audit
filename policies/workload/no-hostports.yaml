apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: workload.no-hostports
  annotations:
    audit.k8s-auditor.io/title: "Containers must not bind a hostPort"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: workload-security
    audit.k8s-auditor.io/remediation: >-
      Remove containerPort.hostPort (or set it to 0) and use a Service
      instead to expose the port; binding a hostPort ties the pod to a
      specific node and lets it claim a port on the host network namespace.
    audit.k8s-auditor.io/cis: "5.2.12"
    audit.k8s-auditor.io/verification-steps: >-
      1. Check whether this is a deliberate, documented pattern (rare, but
      sometimes intentional for specific networking needs like a
      node-local agent) vs. leftover/copy-pasted from an older manifest that
      predates using a Service. 2. A hostPort pins the pod to a specific
      node and can cause scheduling conflicts or an availability issue
      between pods competing for the same port — check whether that's
      already caused a real operational problem on this cluster as a
      secondary signal of urgency.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  validations:
    - expression: |-
        (has(object.spec.containers) ? object.spec.containers
          : (has(object.spec.template) && has(object.spec.template.spec) && has(object.spec.template.spec.containers)) ? object.spec.template.spec.containers
          : (has(object.spec.jobTemplate) && has(object.spec.jobTemplate.spec) && has(object.spec.jobTemplate.spec.template) && has(object.spec.jobTemplate.spec.template.spec) && has(object.spec.jobTemplate.spec.template.spec.containers)) ? object.spec.jobTemplate.spec.template.spec.containers
          : []).all(c,
            !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0)
          )
      message: "Container declares a containerPort.hostPort, binding it to a specific port on the node's network namespace."
