apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: workload.no-latest-tag
  annotations:
    audit.k8s-auditor.io/title: "Container images must be pinned to a specific tag or digest"
    audit.k8s-auditor.io/severity: low
    audit.k8s-auditor.io/category: supply-chain
    audit.k8s-auditor.io/remediation: >-
      Pin the image to an explicit version tag or, preferably, a content
      digest (image@sha256:...) instead of ":latest", another known
      floating/branch tag (:dev, :main, :master, ...), or an implicit tag,
      so deployments are reproducible and not silently changed underneath
      you.
    audit.k8s-auditor.io/verification-steps: >-
      1. Low severity reflects that this is a supply-chain/reproducibility
      hygiene issue (unpredictable deploys, harder rollback, "what version is
      actually running" ambiguity), not a direct exploit — deprioritize
      relative to workload-security findings on the same manifest. 2. Check
      the registry/CI practices behind this image: some pipelines push an
      effectively-immutable image even under a moving tag name, which
      changes the practical reproducibility risk even though the tag string
      itself still fails this check. 3. The Message distinguishes "no tag at
      all" / ":latest" from a named floating tag like ":dev"/":main" — the
      latter usually means a branch/environment naming convention, not a
      forgotten pin, so remediation is more likely "add a release pipeline
      that tags real versions" than "just change one manifest line".
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  validations:
    - expression: |-
        (has(object.spec.containers) ? object.spec.containers
          : (has(object.spec.template) && has(object.spec.template.spec) && has(object.spec.template.spec.containers)) ? object.spec.template.spec.containers
          : (has(object.spec.jobTemplate) && has(object.spec.jobTemplate.spec) && has(object.spec.jobTemplate.spec.template) && has(object.spec.jobTemplate.spec.template.spec) && has(object.spec.jobTemplate.spec.template.spec.containers)) ? object.spec.jobTemplate.spec.template.spec.containers
          : []).all(c,
            has(c.image) && (
              c.image.contains("@sha256:") ||
              (
                c.image.matches("^.*:[^/]+$") &&
                !c.image.endsWith(":latest") &&
                !c.image.endsWith(":dev") &&
                !c.image.endsWith(":develop") &&
                !c.image.endsWith(":main") &&
                !c.image.endsWith(":master") &&
                !c.image.endsWith(":edge") &&
                !c.image.endsWith(":nightly") &&
                !c.image.endsWith(":unstable") &&
                !c.image.endsWith(":canary") &&
                !c.image.endsWith(":snapshot")
              )
            )
          )
      message: "Container image is not pinned to an explicit immutable tag or digest — it has no tag (implicit \":latest\"), or uses a known floating/branch tag (\":latest\", \":dev\", \":develop\", \":main\", \":master\", \":edge\", \":nightly\", \":unstable\", \":canary\", \":snapshot\") that can silently change underneath you."
