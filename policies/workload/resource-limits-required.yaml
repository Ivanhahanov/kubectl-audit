apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: workload.resource-limits-required
  annotations:
    audit.k8s-auditor.io/title: "Containers must declare CPU and memory limits"
    audit.k8s-auditor.io/severity: low
    audit.k8s-auditor.io/category: reliability
    audit.k8s-auditor.io/remediation: >-
      Set resources.limits.cpu and resources.limits.memory on every
      container to prevent a single workload from starving the node and
      affecting other tenants.
    audit.k8s-auditor.io/cis: "5.7.3"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  validations:
    - expression: |-
        (has(object.spec.containers) ? object.spec.containers
          : (has(object.spec.template) && has(object.spec.template.spec) && has(object.spec.template.spec.containers)) ? object.spec.template.spec.containers
          : (has(object.spec.jobTemplate) && has(object.spec.jobTemplate.spec) && has(object.spec.jobTemplate.spec.template) && has(object.spec.jobTemplate.spec.template.spec) && has(object.spec.jobTemplate.spec.template.spec.containers)) ? object.spec.jobTemplate.spec.template.spec.containers
          : []).all(c,
            has(c.resources) && has(c.resources.limits) &&
            has(c.resources.limits.cpu) && has(c.resources.limits.memory)
          )
      message: "Container does not declare both resources.limits.cpu and resources.limits.memory."
