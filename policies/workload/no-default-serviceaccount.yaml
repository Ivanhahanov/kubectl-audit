apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: workload.no-default-serviceaccount
  annotations:
    audit.k8s-auditor.io/title: "Workload does not set a dedicated ServiceAccount"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: rbac
    audit.k8s-auditor.io/remediation: >-
      Create a dedicated ServiceAccount for this workload and set
      spec.serviceAccountName to it, instead of leaving it unset (which
      implicitly uses "default") or setting it to "default" explicitly.
    audit.k8s-auditor.io/cis: "5.1.5"
    audit.k8s-auditor.io/verification-steps: >-
      1. Check whether this workload actually calls the Kubernetes API at
      all — if not, a dedicated zero-permission ServiceAccount is still
      worth creating (defense in depth against automount), but urgency is
      lower than for a workload that genuinely needs API access. 2. Check
      whether automountServiceAccountToken is disabled on this workload (see
      the rbac-analyzer.automount-with-sensitive-access finding, if any) —
      default SA plus an active token mount plus sensitive access bound
      elsewhere in the namespace is the highest-priority combination of this
      finding.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  validations:
    - expression: |-
        !(
          (has(object.spec.serviceAccountName) ? object.spec.serviceAccountName
            : (has(object.spec.template) && has(object.spec.template.spec) && has(object.spec.template.spec.serviceAccountName)) ? object.spec.template.spec.serviceAccountName
            : (has(object.spec.jobTemplate) && has(object.spec.jobTemplate.spec) && has(object.spec.jobTemplate.spec.template) && has(object.spec.jobTemplate.spec.template.spec) && has(object.spec.jobTemplate.spec.template.spec.serviceAccountName)) ? object.spec.jobTemplate.spec.template.spec.serviceAccountName
            : "") in ["", "default"]
        )
      message: "Workload does not set spec.serviceAccountName to a dedicated ServiceAccount (uses the implicit or explicit \"default\" ServiceAccount)."
