apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: network.ingress-tls-required
  annotations:
    audit.k8s-auditor.io/title: "Ingress does not configure TLS"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: network-security
    audit.k8s-auditor.io/remediation: >-
      Set spec.tls with at least one entry (hosts + secretName) so traffic
      to this Ingress is served over HTTPS instead of plaintext HTTP.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      # spec.tls (an array of {hosts, secretName}) has been byte-identical
      # since Ingress's earliest v1beta1 shape (verified against
      # k8s.io/api's networking/v1beta1 and extensions/v1beta1 types.go) —
      # covering all three historical API surfaces here, unlike most
      # bundled policies pinned to a single "v1", is deliberate: a static
      # scan of old manifests (or a genuinely old cluster) using a removed
      # Ingress apiVersion should still get this check, not silently skip
      # it. See network.no-deprecated-ingress-api-version for the
      # complementary check that flags using those old versions at all.
      - apiGroups: ["networking.k8s.io", "extensions"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
  validations:
    - expression: |-
        has(object.spec.tls) && size(object.spec.tls) > 0
      message: "Ingress does not set spec.tls; traffic is served over plaintext HTTP."
