apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: istio.peer-authentication-permissive-mtls
  annotations:
    audit.k8s-auditor.io/title: "[ALPHA] PeerAuthentication allows plaintext (non-mTLS) traffic"
    audit.k8s-auditor.io/severity: high
    audit.k8s-auditor.io/category: istio
    audit.k8s-auditor.io/remediation: >-
      Set spec.mtls.mode to STRICT unless plaintext traffic is genuinely
      required (e.g. during a migration). PeerAuthentication precedence is
      specificity-based (workload-level overrides namespace-level overrides
      the mesh-level "default" object in the root namespace) — this check
      evaluates each object independently and doesn't compute the
      cluster-wide effective mode, so confirm a more specific object isn't
      already enforcing STRICT, and that this object isn't unintentionally
      weakening one. In Istio ambient mode, DISABLE is unsupported and
      STRICT is the mode that actually guarantees mesh traffic can't bypass
      the ztunnel — see the Scope section for ambient-mode caveats.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["security.istio.io"]
        apiVersions: ["v1", "v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["peerauthentications"]
  validations:
    - expression: |-
        !has(object.spec.mtls) || !has(object.spec.mtls.mode) ||
        !(object.spec.mtls.mode in ["DISABLE", "PERMISSIVE"])
      messageExpression: |-
        "[ALPHA] PeerAuthentication sets spec.mtls.mode to \"" + object.spec.mtls.mode +
        "\", allowing plaintext connections alongside (or instead of) mTLS."
