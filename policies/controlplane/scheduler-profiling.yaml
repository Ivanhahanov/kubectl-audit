apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controlplane.scheduler.profiling
  annotations:
    audit.k8s-auditor.io/title: "kube-scheduler profiling is not disabled"
    audit.k8s-auditor.io/severity: low
    audit.k8s-auditor.io/category: control-plane-config
    audit.k8s-auditor.io/remediation: >-
      Set --profiling=false.
    audit.k8s-auditor.io/cis: "1.4.1"
    audit.k8s-auditor.io/verification-steps: >-
      1. Inferred from command-line flags, not node/file access. 2. Test directly:
      attempt to reach the scheduler's /debug/pprof/ endpoint — if it responds,
      profiling is genuinely still exposed; if unreachable, practical exposure is lower
      than the flag inference alone implies.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: |-
        !((has(object.metadata.labels) && 'component' in object.metadata.labels && object.metadata.labels['component'] == 'kube-scheduler') || (object.metadata.namespace == 'kube-system' && object.metadata.name.startsWith('kube-scheduler'))) || (
          object.spec.containers.exists(c, ((has(c.command) ? c.command : []) + (has(c.args) ? c.args : [])).exists(a, a == '--profiling=false'))
        )
      message: "[indirect signal — inferred from the kube-scheduler static Pod's command-line flags via the Kubernetes API, not confirmed via node/file access] --profiling is not explicitly set to false (the pprof debug endpoints are enabled by default when unset)."
