apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controlplane.apiserver.service-account-key-file
  annotations:
    audit.k8s-auditor.io/title: "kube-apiserver has no explicit --service-account-key-file"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: control-plane-config
    audit.k8s-auditor.io/remediation: >-
      Set --service-account-key-file to the public key(s) used to verify ServiceAccount tokens.
    audit.k8s-auditor.io/cis: "1.2.22"
    audit.k8s-auditor.io/verification-steps: >-
      1. Inferred from command-line flags, not node/file access. 2. Confirm which key
      ServiceAccount tokens are actually being validated against — test that a token
      issued by this cluster is accepted (`kubectl auth can-i` using a real SA token) to
      confirm token validation is genuinely working end-to-end, not just infer it from
      flag presence.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: |-
        !((has(object.metadata.labels) && 'component' in object.metadata.labels && object.metadata.labels['component'] == 'kube-apiserver') || (object.metadata.namespace == 'kube-system' && object.metadata.name.startsWith('kube-apiserver'))) || (
          object.spec.containers.exists(c, ((has(c.command) ? c.command : []) + (has(c.args) ? c.args : [])).exists(a, a.startsWith('--service-account-key-file=')))
        )
      message: "[indirect signal — inferred from the kube-apiserver static Pod's command-line flags via the Kubernetes API, not confirmed via node/file access] --service-account-key-file is not set."
