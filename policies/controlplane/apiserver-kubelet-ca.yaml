apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controlplane.apiserver.kubelet-ca
  annotations:
    audit.k8s-auditor.io/title: "kube-apiserver does not verify the kubelet's serving certificate"
    audit.k8s-auditor.io/severity: high
    audit.k8s-auditor.io/category: control-plane-config
    audit.k8s-auditor.io/remediation: >-
      Set --kubelet-certificate-authority to the CA that issued kubelet serving certificates.
    audit.k8s-auditor.io/cis: "1.2.5"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    objectSelector:
      matchLabels:
        component: kube-apiserver
  validations:
    - expression: |-
        object.spec.containers.exists(c, ((has(c.command) ? c.command : []) + (has(c.args) ? c.args : [])).exists(a, a.startsWith('--kubelet-certificate-authority=')))
      message: "[indirect signal — inferred from the kube-apiserver static Pod's command-line flags via the Kubernetes API, not confirmed via node/file access] --kubelet-certificate-authority is not set, so the API server can't verify the kubelet's serving certificate when connecting to it."
