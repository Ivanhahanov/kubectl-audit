apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controlplane.scheduler.bind-address
  annotations:
    audit.k8s-auditor.io/title: "kube-scheduler does not bind to localhost"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: control-plane-config
    audit.k8s-auditor.io/remediation: >-
      Set --bind-address=127.0.0.1 unless the metrics/healthz endpoint genuinely needs to be reachable off-node.
    audit.k8s-auditor.io/cis: "1.4.2"
    audit.k8s-auditor.io/verification-steps: >-
      1. Inferred from command-line flags, not node/file access. 2. Test directly: from
      outside the node, attempt to reach the scheduler's metrics/healthz port on the
      address it's actually bound to — if unreachable off-node despite the flag
      inference, practical exposure is lower than the finding implies.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: |-
        !((has(object.metadata.labels) && 'component' in object.metadata.labels && object.metadata.labels['component'] == 'kube-scheduler') || (object.metadata.namespace == 'kube-system' && object.metadata.name.startsWith('kube-scheduler'))) || (
          object.spec.containers.exists(c, ((has(c.command) ? c.command : []) + (has(c.args) ? c.args : [])).exists(a, a == '--bind-address=127.0.0.1'))
        )
      message: "[indirect signal — inferred from the kube-scheduler static Pod's command-line flags via the Kubernetes API, not confirmed via node/file access] --bind-address is not explicitly set to 127.0.0.1."
