apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controlplane.controller-manager.use-service-account-credentials
  annotations:
    audit.k8s-auditor.io/title: "kube-controller-manager does not use distinct ServiceAccount credentials per controller"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: control-plane-config
    audit.k8s-auditor.io/remediation: >-
      Set --use-service-account-credentials=true so each control loop authenticates with its own, individually auditable ServiceAccount.
    audit.k8s-auditor.io/cis: "1.3.3"
    audit.k8s-auditor.io/verification-steps: >-
      1. Inferred from command-line flags, not node/file access. 2. Test directly: check
      audit logs for individual controller ServiceAccounts (e.g.
      system:serviceaccount:kube-system:replicaset-controller) performing their own
      actions, vs. everything appearing to run as the shared controller-manager
      credential — that's the concrete, observable symptom of this being unset.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: |-
        !((has(object.metadata.labels) && 'component' in object.metadata.labels && object.metadata.labels['component'] == 'kube-controller-manager') || (object.metadata.namespace == 'kube-system' && object.metadata.name.startsWith('kube-controller-manager'))) || (
          object.spec.containers.exists(c, ((has(c.command) ? c.command : []) + (has(c.args) ? c.args : [])).exists(a, a == '--use-service-account-credentials=true'))
        )
      message: "[indirect signal — inferred from the kube-controller-manager static Pod's command-line flags via the Kubernetes API, not confirmed via node/file access] --use-service-account-credentials is not explicitly set to true (defaults to false)."
