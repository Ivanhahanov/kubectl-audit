apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controlplane.apiserver.client-ca-file
  annotations:
    audit.k8s-auditor.io/title: "kube-apiserver has no explicit --client-ca-file"
    audit.k8s-auditor.io/severity: high
    audit.k8s-auditor.io/category: control-plane-config
    audit.k8s-auditor.io/remediation: >-
      Set --client-ca-file to the CA used to validate client certificates presented to the API server.
    audit.k8s-auditor.io/cis: "1.2.25"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    objectSelector:
      matchLabels:
        component: kube-apiserver
  validations:
    - expression: |-
        object.spec.containers.exists(c, ((has(c.command) ? c.command : []) + (has(c.args) ? c.args : [])).exists(a, a.startsWith('--client-ca-file=')))
      message: "[indirect signal — inferred from the kube-apiserver static Pod's command-line flags via the Kubernetes API, not confirmed via node/file access] --client-ca-file is not set."
