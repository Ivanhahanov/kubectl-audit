apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controlplane.apiserver.audit-log-path
  annotations:
    audit.k8s-auditor.io/title: "kube-apiserver audit logging is not configured"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: control-plane-config
    audit.k8s-auditor.io/remediation: >-
      Set --audit-log-path (and an --audit-policy-file) so API requests are logged.
    audit.k8s-auditor.io/cis: "1.2.16"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    objectSelector:
      matchLabels:
        component: kube-apiserver
  validations:
    - expression: |-
        object.spec.containers.exists(c, ((has(c.command) ? c.command : []) + (has(c.args) ? c.args : [])).exists(a, a.startsWith('--audit-log-path=')))
      message: "[indirect signal — inferred from the kube-apiserver static Pod's command-line flags via the Kubernetes API, not confirmed via node/file access] --audit-log-path is not set: no audit log is being written."
