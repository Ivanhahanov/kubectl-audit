apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controlplane.apiserver.anonymous-auth
  annotations:
    audit.k8s-auditor.io/title: "Anonymous authentication is not disabled"
    audit.k8s-auditor.io/severity: high
    audit.k8s-auditor.io/category: control-plane-config
    audit.k8s-auditor.io/remediation: >-
      Set --anonymous-auth=false on kube-apiserver so unauthenticated requests are rejected.
    audit.k8s-auditor.io/cis: "1.2.1"
    audit.k8s-auditor.io/verification-steps: >-
      1. This is inferred from the Pod's command-line flags via the Kubernetes API, not
      confirmed via node/file access — cross-check the actual running process if you
      have node access. 2. Test directly: `curl -k https://<apiserver-host>:6443/api`
      with no credentials — a 401/403 confirms anonymous access is genuinely rejected in
      practice, regardless of what the flag inference suggests.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: |-
        !((has(object.metadata.labels) && 'component' in object.metadata.labels && object.metadata.labels['component'] == 'kube-apiserver') || (object.metadata.namespace == 'kube-system' && object.metadata.name.startsWith('kube-apiserver'))) || (
          object.spec.containers.exists(c, ((has(c.command) ? c.command : []) + (has(c.args) ? c.args : [])).exists(a, a == '--anonymous-auth=false'))
        )
      message: "[indirect signal — inferred from the kube-apiserver static Pod's command-line flags via the Kubernetes API, not confirmed via node/file access] --anonymous-auth is not explicitly set to false (anonymous requests are permitted by default when unset)."
