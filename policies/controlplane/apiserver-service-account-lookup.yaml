apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controlplane.apiserver.service-account-lookup
  annotations:
    audit.k8s-auditor.io/title: "kube-apiserver disables service account token lookup"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: control-plane-config
    audit.k8s-auditor.io/remediation: >-
      Don't set --service-account-lookup=false; without it, deleted/invalidated service account tokens keep working.
    audit.k8s-auditor.io/cis: "1.2.21"
    audit.k8s-auditor.io/verification-steps: >-
      1. Inferred from command-line flags, not node/file access. 2. Test directly:
      delete a ServiceAccount whose token is still being used and check whether
      subsequent requests with that token are now rejected — that's the concrete
      behavior --service-account-lookup=true is supposed to guarantee, and the
      definitive way to confirm it either way.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: |-
        !((has(object.metadata.labels) && 'component' in object.metadata.labels && object.metadata.labels['component'] == 'kube-apiserver') || (object.metadata.namespace == 'kube-system' && object.metadata.name.startsWith('kube-apiserver'))) || (
          !object.spec.containers.exists(c, ((has(c.command) ? c.command : []) + (has(c.args) ? c.args : [])).exists(a, a == '--service-account-lookup=false'))
        )
      message: "[indirect signal — inferred from the kube-apiserver static Pod's command-line flags via the Kubernetes API, not confirmed via node/file access] --service-account-lookup=false is set, so deleted or invalidated ServiceAccount tokens continue to be accepted."
