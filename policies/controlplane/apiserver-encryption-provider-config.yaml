apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controlplane.apiserver.encryption-provider-config
  annotations:
    audit.k8s-auditor.io/title: "kube-apiserver has no encryption-at-rest configuration"
    audit.k8s-auditor.io/severity: high
    audit.k8s-auditor.io/category: control-plane-config
    audit.k8s-auditor.io/remediation: >-
      Set --encryption-provider-config to an EncryptionConfiguration that encrypts Secrets (at minimum) at rest in etcd.
    audit.k8s-auditor.io/cis: "1.2.27"
    audit.k8s-auditor.io/verification-steps: >-
      1. Inferred from command-line flags, not node/file access. 2. This has a
      definitive, direct test if you have etcd access: read a Secret's raw value from
      etcd (`etcdctl get /registry/secrets/<ns>/<name>` with appropriate certs) and
      check whether it's plaintext JSON or carries an encryption-provider prefix (e.g.
      k8s:enc:aescbc:v1:) — far more reliable than the flag's mere presence, since the
      referenced config file's actual content (which provider, which key) isn't visible
      to this tool at all.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: |-
        !((has(object.metadata.labels) && 'component' in object.metadata.labels && object.metadata.labels['component'] == 'kube-apiserver') || (object.metadata.namespace == 'kube-system' && object.metadata.name.startsWith('kube-apiserver'))) || (
          object.spec.containers.exists(c, ((has(c.command) ? c.command : []) + (has(c.args) ? c.args : [])).exists(a, a.startsWith('--encryption-provider-config=')))
        )
      message: "[indirect signal — inferred from the kube-apiserver static Pod's command-line flags via the Kubernetes API, not confirmed via node/file access] --encryption-provider-config is not set: Secrets are stored in etcd unencrypted."
