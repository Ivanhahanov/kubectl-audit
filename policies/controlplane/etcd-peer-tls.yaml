apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controlplane.etcd.peer-tls
  annotations:
    audit.k8s-auditor.io/title: "etcd peer connections are not using TLS certificates"
    audit.k8s-auditor.io/severity: high
    audit.k8s-auditor.io/category: control-plane-config
    audit.k8s-auditor.io/remediation: >-
      Set both --peer-cert-file and --peer-key-file on etcd.
    audit.k8s-auditor.io/cis: "2.4"
    audit.k8s-auditor.io/verification-steps: >-
      1. Inferred from command-line flags, not node/file access. 2. If you have etcd
      access, check etcd logs for peer TLS handshake details — a misconfigured peer TLS
      setup can silently fall back to plaintext without an obvious apiserver-facing
      symptom, so this is worth confirming directly rather than trusting flag presence
      alone.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: |-
        !((has(object.metadata.labels) && 'component' in object.metadata.labels && object.metadata.labels['component'] == 'etcd') || (object.metadata.namespace == 'kube-system' && object.metadata.name.startsWith('etcd'))) || (
          object.spec.containers.exists(c, ((has(c.command) ? c.command : []) + (has(c.args) ? c.args : [])).exists(a, a.startsWith('--peer-cert-file=')) && ((has(c.command) ? c.command : []) + (has(c.args) ? c.args : [])).exists(a, a.startsWith('--peer-key-file=')))
        )
      message: "[indirect signal — inferred from the etcd static Pod's command-line flags via the Kubernetes API, not confirmed via node/file access] --peer-cert-file and/or --peer-key-file is not set."
