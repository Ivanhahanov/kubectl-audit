apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controlplane.apiserver.profiling
  annotations:
    audit.k8s-auditor.io/title: "kube-apiserver profiling is not disabled"
    audit.k8s-auditor.io/severity: low
    audit.k8s-auditor.io/category: control-plane-config
    audit.k8s-auditor.io/remediation: >-
      Set --profiling=false to disable the pprof debug endpoints.
    audit.k8s-auditor.io/cis: "1.2.15"
    audit.k8s-auditor.io/verification-steps: >-
      1. Inferred from command-line flags, not node/file access. 2. Test directly:
      attempt to reach the apiserver's /debug/pprof/ endpoint on its metrics/healthz
      port — if it responds, profiling is genuinely still exposed; if unreachable
      (NetworkPolicy, firewall, no route from your position), the practical exposure is
      lower than the flag inference alone implies.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: |-
        !((has(object.metadata.labels) && 'component' in object.metadata.labels && object.metadata.labels['component'] == 'kube-apiserver') || (object.metadata.namespace == 'kube-system' && object.metadata.name.startsWith('kube-apiserver'))) || (
          object.spec.containers.exists(c, ((has(c.command) ? c.command : []) + (has(c.args) ? c.args : [])).exists(a, a == '--profiling=false'))
        )
      message: "[indirect signal — inferred from the kube-apiserver static Pod's command-line flags via the Kubernetes API, not confirmed via node/file access] --profiling is not explicitly set to false (the pprof debug endpoints are enabled by default when unset)."
