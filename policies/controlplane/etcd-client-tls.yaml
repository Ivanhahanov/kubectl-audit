apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controlplane.etcd.client-tls
  annotations:
    audit.k8s-auditor.io/title: "etcd client connections are not using TLS certificates"
    audit.k8s-auditor.io/severity: critical
    audit.k8s-auditor.io/category: control-plane-config
    audit.k8s-auditor.io/remediation: >-
      Set both --cert-file and --key-file on etcd.
    audit.k8s-auditor.io/cis: "2.1"
    audit.k8s-auditor.io/verification-steps: >-
      1. Inferred from command-line flags, not node/file access. 2. Confirm both --cert-
      file and --key-file are genuinely absent (the Message states which) — either alone
      without the other is still a real TLS misconfiguration, and checking etcd's actual
      listening config (if you have node access) is more reliable than the flag
      inference alone.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: |-
        !((has(object.metadata.labels) && 'component' in object.metadata.labels && object.metadata.labels['component'] == 'etcd') || (object.metadata.namespace == 'kube-system' && object.metadata.name.startsWith('etcd'))) || (
          object.spec.containers.exists(c, ((has(c.command) ? c.command : []) + (has(c.args) ? c.args : [])).exists(a, a.startsWith('--cert-file=')) && ((has(c.command) ? c.command : []) + (has(c.args) ? c.args : [])).exists(a, a.startsWith('--key-file=')))
        )
      message: "[indirect signal — inferred from the etcd static Pod's command-line flags via the Kubernetes API, not confirmed via node/file access] --cert-file and/or --key-file is not set."
