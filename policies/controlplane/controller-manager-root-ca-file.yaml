apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controlplane.controller-manager.root-ca-file
  annotations:
    audit.k8s-auditor.io/title: "kube-controller-manager has no explicit --root-ca-file"
    audit.k8s-auditor.io/severity: medium
    audit.k8s-auditor.io/category: control-plane-config
    audit.k8s-auditor.io/remediation: >-
      Set --root-ca-file to the cluster's root CA, which is distributed into every ServiceAccount's projected volume.
    audit.k8s-auditor.io/cis: "1.3.5"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: |-
        !((has(object.metadata.labels) && 'component' in object.metadata.labels && object.metadata.labels['component'] == 'kube-controller-manager') || (object.metadata.namespace == 'kube-system' && object.metadata.name.startsWith('kube-controller-manager'))) || (
          object.spec.containers.exists(c, ((has(c.command) ? c.command : []) + (has(c.args) ? c.args : [])).exists(a, a.startsWith('--root-ca-file=')))
        )
      message: "[indirect signal — inferred from the kube-controller-manager static Pod's command-line flags via the Kubernetes API, not confirmed via node/file access] --root-ca-file is not set."
