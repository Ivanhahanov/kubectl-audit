apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubectl-audit-server
  namespace: kubectl-audit-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubectl-audit-server
  namespace: kubectl-audit-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: kubectl-audit-server}
  template:
    metadata:
      labels: {app: kubectl-audit-server}
    spec:
      serviceAccountName: kubectl-audit-server
      containers:
        - name: server
          image: kubectl-audit-server:demo
          imagePullPolicy: IfNotPresent
          env:
            - {name: DATABASE_URL, value: "postgres://audit:audit-demo-password@postgres:5432/auditdb?sslmode=disable"}
            - {name: ADMIN_TOKEN, value: "demo-admin-token"}
            - {name: LISTEN_ADDR, value: ":8080"}
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: kubectl-audit-server
  namespace: kubectl-audit-system
spec:
  selector: {app: kubectl-audit-server}
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubectl-audit-worker
  namespace: kubectl-audit-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: kubectl-audit-worker}
  template:
    metadata:
      labels: {app: kubectl-audit-worker}
    spec:
      containers:
        - name: worker
          image: kubectl-audit-worker:demo
          imagePullPolicy: IfNotPresent
          env:
            - {name: DATABASE_URL, value: "postgres://audit:audit-demo-password@postgres:5432/auditdb?sslmode=disable"}
            - {name: AUTOMATION_INTERVAL_SECONDS, value: "300"}
