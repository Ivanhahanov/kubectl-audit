apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubectl-audit-server
  namespace: kubectl-audit-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubectl-audit-server-tekton-trigger
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubectl-audit-server-tekton-trigger
subjects:
  - kind: ServiceAccount
    name: kubectl-audit-server
    namespace: kubectl-audit-system
roleRef:
  kind: ClusterRole
  name: kubectl-audit-server-tekton-trigger
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubectl-audit-server
  namespace: kubectl-audit-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: kubectl-audit-server}
  template:
    metadata:
      labels: {app: kubectl-audit-server}
    spec:
      serviceAccountName: kubectl-audit-server
      containers:
        - name: server
          image: kubectl-audit-server:demo
          imagePullPolicy: IfNotPresent
          env:
            - {name: DATABASE_URL, value: "postgres://audit:audit-demo-password@postgres:5432/auditdb?sslmode=disable"}
            - {name: ADMIN_TOKEN, value: "demo-admin-token"}
            - {name: LISTEN_ADDR, value: ":8080"}
            - {name: PIPELINE_TRIGGER, value: "tekton"}
            - {name: TEKTON_NAMESPACE, value: "kubectl-audit-system"}
            - {name: TEKTON_PIPELINE_NAME, value: "kubectl-audit-scan-and-push"}
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: kubectl-audit-server
  namespace: kubectl-audit-system
spec:
  selector: {app: kubectl-audit-server}
  ports:
    - port: 8080
      targetPort: 8080
