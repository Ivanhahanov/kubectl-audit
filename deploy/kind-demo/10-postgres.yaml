apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kubectl-audit-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: auditdb}
            - {name: POSTGRES_USER, value: audit}
            - {name: POSTGRES_PASSWORD, value: audit-demo-password}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "audit"]
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kubectl-audit-system
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
      targetPort: 5432
