apiVersion: v1
kind: Secret
metadata:
  name: kubectl-audit-server-token
  namespace: kubectl-audit-system
type: Opaque
stringData:
  token: "REPLACED_AT_APPLY_TIME"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kubectl-audit-scan-and-push
  namespace: kubectl-audit-system
spec:
  volumes:
    - name: workspace
      emptyDir: {}
  steps:
    - name: scan
      image: kubectl-audit:demo
      imagePullPolicy: IfNotPresent
      command: ["/usr/local/bin/kubectl-audit"]
      args: ["scan", "-A", "--output-json", "/workspace/findings.json", "--fail-on", "none"]
      volumeMounts:
        - {name: workspace, mountPath: /workspace}
    - name: push
      image: kubectl-audit:demo
      imagePullPolicy: IfNotPresent
      command: ["/usr/local/bin/kubectl-audit"]
      args: ["push", "--findings", "/workspace/findings.json"]
      env:
        - {name: KUBECTL_AUDIT_SERVER_URL, value: "http://kubectl-audit-server.kubectl-audit-system.svc:8080"}
        - name: KUBECTL_AUDIT_SERVER_TOKEN
          valueFrom:
            secretKeyRef: {name: kubectl-audit-server-token, key: token}
      volumeMounts:
        - {name: workspace, mountPath: /workspace}
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: kubectl-audit-scan-and-push
  namespace: kubectl-audit-system
spec:
  tasks:
    - name: scan-and-push
      taskRef: {name: kubectl-audit-scan-and-push}
