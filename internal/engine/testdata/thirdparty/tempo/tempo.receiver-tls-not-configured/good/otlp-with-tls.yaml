apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo
  namespace: tempo
data:
  tempo.yaml: |
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
              tls:
                cert_file: /etc/tempo/tls/tls.crt
                key_file: /etc/tempo/tls/tls.key
