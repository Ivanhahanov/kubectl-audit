apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-config
  namespace: temporal
data:
  config_template.yaml: |-
    log:
      stdout: true
      level: "info"

    persistence:
      defaultStore: default

    global:
      membership:
        name: temporal
        maxJoinDuration: 30s

      pprof:
        port: 7936

      metrics:
        tags:
          type: frontend
