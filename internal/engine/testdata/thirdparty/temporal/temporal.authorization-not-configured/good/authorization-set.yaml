apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-config
  namespace: temporal
data:
  config_template.yaml: |-
    log:
      stdout: true
      level: "info"

    global:
      membership:
        name: temporal
        maxJoinDuration: 30s

      authorization:
        authorizer: "default"
        claimMapper: "default"

      pprof:
        port: 7936
