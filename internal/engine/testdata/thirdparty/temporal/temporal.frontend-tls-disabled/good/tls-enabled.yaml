apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-config
  namespace: temporal
data:
  config_template.yaml: |-
    services:
      frontend:
        rpc:
          grpcPort: 7233
          httpPort: 7243
          membershipPort: 6933
          bindOnIP: "0.0.0.0"

    global:
      tls:
        frontend:
          enabled: true
          secretName: "frontend-tls"
          mountPath: /etc/temporal/tls/frontend
