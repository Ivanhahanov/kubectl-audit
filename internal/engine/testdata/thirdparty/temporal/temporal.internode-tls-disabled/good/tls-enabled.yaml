apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-config
  namespace: temporal
data:
  config_template.yaml: |-
    services:
      frontend:
        rpc:
          grpcPort: 7233

    global:
      tls:
        internode:
          enabled: true
          secretName: "internode-tls"
          mountPath: /etc/temporal/tls/internode
