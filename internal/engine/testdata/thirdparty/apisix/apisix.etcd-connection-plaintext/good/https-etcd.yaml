apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix
data:
  config.yaml: |
    deployment:
      admin:
        admin_key_required: true
        allow_admin:
          - 127.0.0.1/24
    etcd:
      host:
        - "https://apisix-etcd.default.svc.cluster.local:2379"
      prefix: /apisix
      tls:
        verify: true
