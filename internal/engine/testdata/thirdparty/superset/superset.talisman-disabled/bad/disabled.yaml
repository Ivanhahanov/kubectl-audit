apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: superset
spec:
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      containers:
        - name: superset
          image: apache/superset:3.1.0
          env:
            - name: TALISMAN_ENABLED
              value: "false"
