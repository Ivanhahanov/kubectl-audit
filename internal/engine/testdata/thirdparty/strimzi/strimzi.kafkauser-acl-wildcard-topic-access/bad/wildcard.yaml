apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: bad
  namespace: default
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations:
          - Read
          - Describe
