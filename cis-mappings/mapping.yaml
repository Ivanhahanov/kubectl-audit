# CIS Kubernetes Benchmark control table.
#
# Section numbering/titles follow the public CIS Kubernetes Benchmark
# structure (sections 1-5). Exact control text can vary slightly between
# benchmark revisions; treat this mapping as a practical cross-reference for
# API-observable controls, not a substitute for the official CIS PDF when
# compliance-grade attestation is required.
#
# Sections 1-4 (control plane components, etcd, control-plane configuration
# files, worker node/kubelet configuration) require SSH/file access to node
# filesystems and process arguments that a kubectl plugin fundamentally
# cannot see through the Kubernetes API. They are represented here as single
# not-applicable rows pointing at kube-bench, which runs on the nodes
# themselves.
version: "1.8"
controls:
  - id: "1"
    title: "Control Plane Components"
    section: "Control Plane Components"
    applicable: false
    naReason: "Requires SSH/file access to control-plane node config files and process arguments. Run kube-bench on the control-plane nodes for this section."

  - id: "2"
    title: "etcd"
    section: "etcd"
    applicable: false
    naReason: "Requires access to etcd's data directory and config files on the node. Run kube-bench on the etcd nodes for this section."

  - id: "3"
    title: "Control Plane Configuration"
    section: "Control Plane Configuration"
    applicable: false
    naReason: "Requires access to control-plane node configuration files (admin.conf, scheduler.conf, etc). Run kube-bench on the control-plane nodes for this section."

  - id: "4"
    title: "Worker Nodes"
    section: "Worker Nodes"
    applicable: false
    naReason: "Requires access to kubelet configuration files and process arguments on each node. Run kube-bench on the worker nodes for this section."

  - id: "5.1.1"
    title: "Ensure cluster-admin role is only used where required, and not bound to anonymous/unauthenticated subjects"
    section: "RBAC and Service Accounts"
    applicable: true
    policyIds: ["rbac.no-cluster-admin-binding", "rbac.no-anonymous-binding"]

  - id: "5.1.2"
    title: "Minimize wildcard use in Roles and ClusterRoles"
    section: "RBAC and Service Accounts"
    applicable: true
    policyIds: ["rbac.no-wildcard-rules"]

  - id: "5.1.3"
    title: "Minimize access to privilege-escalation primitives (escalate/bind/impersonate, pod exec, RBAC self-modification, broad secrets access)"
    section: "RBAC and Service Accounts"
    applicable: true
    nativeCheckIds:
      - "rbac-analyzer.escalation-verb"
      - "rbac-analyzer.pod-exec-access"
      - "rbac-analyzer.broad-secrets-access"
      - "rbac-analyzer.rbac-self-modification"

  - id: "5.1.5"
    title: "Ensure default ServiceAccounts are not actively used"
    section: "RBAC and Service Accounts"
    applicable: true
    nativeCheckIds: ["rbac-analyzer.default-serviceaccount-bound"]

  - id: "5.1.6"
    title: "Ensure ServiceAccount tokens are only mounted where necessary"
    section: "RBAC and Service Accounts"
    applicable: true
    nativeCheckIds: ["rbac-analyzer.automount-with-sensitive-access"]

  - id: "5.2.1"
    title: "Minimize the admission of privileged containers"
    section: "Pod Security Standards"
    applicable: true
    policyIds: ["workload.no-privileged-containers"]

  - id: "5.2.4"
    title: "Minimize the admission of containers wishing to share the host process/network/IPC namespace"
    section: "Pod Security Standards"
    applicable: true
    policyIds: ["workload.no-host-namespaces"]

  - id: "5.2.5"
    title: "Minimize the admission of containers with allowPrivilegeEscalation"
    section: "Pod Security Standards"
    applicable: true
    policyIds: ["workload.no-privileged-containers"]

  - id: "5.2.6"
    title: "Minimize the admission of root containers and hostPath volumes"
    section: "Pod Security Standards"
    applicable: true
    policyIds: ["workload.run-as-non-root", "workload.no-hostpath-volumes"]

  - id: "5.2.7"
    title: "Minimize the admission of containers with a writable root filesystem"
    section: "Pod Security Standards"
    applicable: true
    policyIds: ["workload.read-only-root-fs"]

  - id: "5.2.9"
    title: "Minimize the admission of containers with added/retained capabilities beyond the default set"
    section: "Pod Security Standards"
    applicable: true
    policyIds: ["workload.drop-all-capabilities"]

  - id: "5.2.10"
    title: "Ensure a valid seccomp profile is set"
    section: "Pod Security Standards"
    applicable: true
    policyIds: ["workload.seccomp-profile-required"]

  - id: "5.3.2"
    title: "Ensure every workload has applicable NetworkPolicy coverage"
    section: "Network Policies and CNI"
    applicable: true
    nativeCheckIds: ["netpol-analyzer.no-network-policy-coverage"]
    note: >-
      Checked precisely for native Kubernetes NetworkPolicy (podSelector +
      policyTypes matched against each workload's pod-template labels).
      Cilium (CiliumNetworkPolicy/CiliumClusterwideNetworkPolicy) and Calico
      (crd.projectcalico.org/v1 NetworkPolicy/GlobalNetworkPolicy) are only
      checked for presence, not simulated in detail — see internal/netpol.

  - id: "5.7.2"
    title: "Ensure images are pinned to an explicit tag or digest, not :latest"
    section: "General Policies"
    applicable: true
    policyIds: ["workload.no-latest-tag"]

  - id: "5.7.3"
    title: "Ensure CPU and memory limits are set to isolate workloads"
    section: "General Policies"
    applicable: true
    policyIds: ["workload.resource-limits-required"]
