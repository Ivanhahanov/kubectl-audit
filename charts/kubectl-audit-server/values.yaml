image:
  repository: kubectl-audit-server
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# worker is kubectl-audit-worker's own Deployment — see
# templates/worker-deployment.yaml for why it's separate from the server.
worker:
  image:
    repository: kubectl-audit-worker
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources: {}

service:
  type: ClusterIP
  port: 8080

resources: {}

# adminToken gates cluster registration, triage, and every
# organization-level config endpoint (knowledge base, exclusion rules,
# automation rules) — see internal/server/http.NewServer's doc comment.
adminToken:
  # Used directly if set (e.g. via --set-string or a values file backed by
  # your own secrets tooling). Leave empty to auto-generate one instead.
  value: ""
  # Name of an existing Secret (key: adminTokenExistingSecretKey) to source
  # the token from, managed outside this chart's install/upgrade lifecycle
  # entirely — takes precedence over both `value` and auto-generation.
  existingSecretName: ""
  existingSecretKey: "token"

# postgres.cnpg is the default: this chart owns a CloudNativePG Cluster CR
# and connects using its auto-generated "<name>-app" Secret directly — no
# custom credential plumbing. Requires the CNPG operator (and its CRDs)
# already installed cluster-wide; this chart does not install the operator
# itself. Set cnpg.enabled=false and use existingSecretName/externalDSN
# instead to point at a Postgres you manage yourself.
postgres:
  cnpg:
    enabled: true
    instances: 1
    storage:
      size: 1Gi
      storageClass: ""
  # Escape hatch #1: an existing Secret with a `uri`-shaped key (same
  # convention CNPG itself uses) — e.g. one managed by a different
  # operator, or hand-created for a managed Postgres instance.
  existingSecretName: ""
  existingSecretKey: "uri"
  # Escape hatch #2: a plain connection string, for quick local testing
  # only — prefer existingSecretName for anything else, so the DSN (which
  # embeds a password) never ends up in `helm get values` output or a
  # values file.
  externalDSN: ""

automation:
  # How often kubectl-audit-worker checks automation_rules against every
  # registered cluster's current findings/triage state.
  intervalSeconds: 300
