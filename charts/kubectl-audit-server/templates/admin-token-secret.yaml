{{- if not .Values.adminToken.existingSecretName }}
{{- $secretName := include "kubectl-audit-server.adminTokenSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $token := .Values.adminToken.value }}
{{- if not $token }}
  {{- if $existing }}
    {{- $token = index $existing.data "token" | b64dec }}
  {{- else }}
    {{- $token = randAlphaNum 40 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubectl-audit-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
