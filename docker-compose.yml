# Zero-Kubernetes quick start for kubectl-audit-server: Postgres + the
# server itself, for trying out ingestion/triage/knowledge-base/exclusion-
# rules/automation-rules matching without a cluster at all. Audit-requests'
# Tekton trigger needs a real cluster — see deploy/kind-demo and
# charts/kubectl-audit-server for that path. See docs/server.md for a full
# walkthrough of every feature.
#
# Build the image first: docker build --target server -t kubectl-audit-server:demo .
# Then: docker compose up
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auditdb
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit-demo-password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "audit"]
      interval: 3s
      timeout: 3s
      retries: 10

  server:
    image: kubectl-audit-server:demo
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://audit:audit-demo-password@postgres:5432/auditdb?sslmode=disable"
      ADMIN_TOKEN: "demo-admin-token"
      LISTEN_ADDR: ":8080"
    ports:
      - "8080:8080"
