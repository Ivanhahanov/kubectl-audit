# FSTEC "Требования по безопасности информации, предъявляемые к средствам
# контейнеризации" (текст предоставлен пользователем, см. fstec.txt в корне
# репозитория на момент написания).
#
# ВАЖНО: этот документ сертифицирует САМО СРЕДСТВО КОНТЕЙНЕРИЗАЦИИ как
# программный продукт (Docker/containerd/дистрибутив Kubernetes) — то есть
# оценивает, что умеет делать инструмент, а не то, как настроен конкретный
# кластер. Поэтому значительная часть требований (парольная политика,
# фиксированная 3-ролевая модель самого средства, сертифицированное
# сканирование по банку данных угроз ФСТЭК, GOST-формат журнала событий)
# принципиально не наблюдаема через Kubernetes API — это не пробел в
# реализации, а несоответствие природы документа природе инструмента аудита.
# Такие пункты помечены applicable: false с объяснением. Пункты, где есть
# честное соответствие уже реализованным проверкам, замаплены на policyIds/
# nativeCheckIds и, где уместно, на связанные контролы CIS (crossRefs.cis).
#
# Использованный класс защиты: требования пунктов 9-16 определены для
# классов защиты 6/5/4 (наиболее часто применимых вне гостайны/КИИ высшей
# категории); нумерация id соответствует нумерации пунктов/подпунктов
# исходного документа.
id: fstec
title: "ФСТЭК: Требования к средствам контейнеризации"
version: "2024"
controls:
  - id: "6"
    title: "Средство контейнеризации должно соответствовать требуемому уровню доверия (приказ ФСТЭК №76)"
    section: "Уровень доверия"
    applicable: false
    naReason: "Сертификация продукта на соответствие отдельному приказу ФСТЭК №76 (уровни доверия) — оценивается процесс разработки и поставки средства контейнеризации, а не конфигурация кластера. Не наблюдаемо через Kubernetes API."

  - id: "7"
    title: "Хостовая ОС должна быть сертифицирована по требованиям к операционным системам (приказ ФСТЭК №119) и по уровням доверия (№76)"
    section: "Хостовая операционная система"
    applicable: false
    naReason: "Требует сертификации и проверки конфигурации хостовой ОС узлов кластера — доступ к узлам вне области видимости kubectl-плагина, работающего через Kubernetes API."

  - id: "9.1"
    title: "Средство контейнеризации должно реализовывать механизмы изоляции контейнеров (способ определяется разработчиком)"
    section: "Изоляция контейнеров"
    applicable: false
    naReason: "Общее требование к наличию у продукта механизмов изоляции как таковых (способ реализации не регламентирован) — это свойство container runtime/платформы, а не отдельно проверяемая настройка манифеста."

  - id: "9.2"
    title: "Изоляция пространств имён процессов, IPC, пользователей и групп, хостов/доменов, сети, иерархии каталогов контейнеров (классы защиты 5 и 4)"
    section: "Изоляция контейнеров"
    applicable: true
    policyIds: ["workload.no-host-namespaces"]
    crossRefs:
      cis: ["5.2.3", "5.2.4", "5.2.5"]
    note: >-
      Частичное соответствие: workload.no-host-namespaces проверяет, что
      hostPID/hostIPC/hostNetwork не включены (т.е. изоляция соответствующих
      пространств имён не отключена явно). Изоляция пространств имён
      пользователей/групп (user namespaces, поле spec.hostUsers) и иерархии
      каталогов (mount namespace) отдельно не проверяется в этой версии.

  - id: "10.1"
    title: "Выявление известных уязвимостей образов при создании/установке/хранении во взаимодействии с сертифицированным сканером и БДУ ФСТЭК, не реже раза в месяц, с оповещением"
    section: "Выявление уязвимостей в образах контейнеров"
    applicable: false
    naReason: "Требует интеграции с сертифицированным сканером уязвимостей и банком данных угроз ФСТЭК (БДУ) — активное сканирование содержимого образа, а не анализ манифеста. Инструмент проверяет только факт закрепления тега/дайджеста образа (workload.no-latest-tag), что не является выявлением уязвимостей."

  - id: "10.2"
    title: "Запрет создания образов с известными уязвимостями критического/высокого уровня опасности, сканирование не реже раза в неделю (классы 5 и 4)"
    section: "Выявление уязвимостей в образах контейнеров"
    applicable: false
    naReason: "Требует блокирующей интеграции со сканером уязвимостей на этапе сборки/публикации образа — вне области видимости аудита работающего кластера через API."

  - id: "11"
    title: "Ограничение прав на периферийные/блочные устройства, ограничение вычислительных ресурсов, монтирование корневой ФС хоста только для чтения"
    section: "Проверка корректности конфигурации контейнеров"
    applicable: true
    policyIds:
      - "workload.no-hostpath-volumes"
      - "workload.resource-limits-required"
      - "workload.read-only-root-fs"
    crossRefs:
      cis: ["5.2.11", "5.6.3"]
    note: >-
      workload.no-hostpath-volumes — частичное соответствие ограничению
      доступа к устройствам/носителям (блокирует hostPath в целом, не только
      блочные устройства). workload.resource-limits-required покрывает
      CPU/память (для этого пункта в CIS Kubernetes Benchmark v2.0.1 больше
      нет отдельного контрола — старый 5.7.3 исключён из бенчмарка);
      отдельного ограничения на операции ввода-вывода нет.
      workload.read-only-root-fs — прямое соответствие требованию о
      монтировании корневой ФС хоста в режиме "только для чтения" (в составе
      сборного контрола CIS 5.6.3).

  - id: "12.1"
    title: "Контроль целостности образов и исполняемых файлов контейнеров, оповещение при нарушении"
    section: "Контроль целостности контейнеров и их образов"
    applicable: true
    policyIds: ["workload.no-latest-tag"]
    note: >-
      Это слабый косвенный признак, а не контроль целостности: закрепление
      образа за конкретным тегом/дайджестом (workload.no-latest-tag) снижает
      риск незаметной подмены содержимого, но не является активной проверкой
      целостности (криптографическая проверка/подпись, мониторинг
      исполняемых файлов). Полноценный контроль целостности требует
      отдельного сертифицированного средства и не реализован. Контрол CIS
      Kubernetes Benchmark, ранее соответствовавший этому пункту (старый
      5.7.2, "images pinned to an explicit tag or digest"), исключён из
      бенчмарка начиная с v2.0.1, поэтому прямого crossRefs.cis больше нет.

  - id: "12.2"
    title: "Контроль целостности параметров настройки средства контейнеризации (класс защиты 5)"
    section: "Контроль целостности контейнеров и их образов"
    applicable: false
    naReason: "Контроль целостности конфигурации самого средства контейнеризации (container runtime/control plane) — не объект аудита манифестов/API ресурсов кластера."

  - id: "12.3"
    title: "Контроль целостности сведений о событиях безопасности, контроль образов и конфигурации по ЭП при установке и периодически, блокировка запуска при нарушении целостности (класс защиты 4)"
    section: "Контроль целостности контейнеров и их образов"
    applicable: false
    naReason: "Требует криптографической проверки электронной подписи образов и блокирующего механизма на уровне container runtime — вне области видимости и возможностей API-аудита."

  - id: "13.1"
    title: "Регистрация событий безопасности (несанкционированный доступ, инциденты, реакция на них), ведение журнала с учётом ГОСТ Р 59548-2022"
    section: "Регистрация событий безопасности"
    applicable: false
    naReason: "Журналирование событий безопасности — конфигурация control-plane (kube-apiserver --audit-policy-file) и container runtime, формат по ГОСТ Р 59548-2022. Это конфигурация узлов/control-plane, а не состояние объектов API, наблюдаемое через kubectl."

  - id: "13.2"
    title: "Регистрация событий выявления уязвимостей/некорректной конфигурации и нарушения целостности, с указанием критичности (класс защиты 5)"
    section: "Регистрация событий безопасности"
    applicable: false
    naReason: "Зависит от внешних средств сканирования уязвимостей и контроля целостности (см. 10.x, 12.x), события которых регистрируются вне Kubernetes API."

  - id: "13.3"
    title: "Запись событий с указанием идентификатора пользователя хостовой ОС, от имени которого запущен контейнер (класс защиты 4)"
    section: "Регистрация событий безопасности"
    applicable: false
    naReason: "Требует атрибуции на уровне хостовой ОС/container runtime — вне области видимости API-аудита кластера."

  - id: "14"
    title: "Ролевая модель управления доступом в средстве контейнеризации"
    section: "Управление доступом"
    applicable: true
    nativeCheckIds:
      - "rbac-analyzer.escalation-verb"
      - "rbac-analyzer.pod-exec-access"
      - "rbac-analyzer.broad-secrets-access"
      - "rbac-analyzer.rbac-self-modification"
      - "rbac-analyzer.default-serviceaccount-bound"
      - "rbac-analyzer.automount-with-sensitive-access"
    policyIds: ["rbac.no-wildcard-rules", "rbac.no-cluster-admin-binding", "rbac.no-anonymous-binding"]
    crossRefs:
      cis: ["5.1.1", "5.1.2", "5.1.3", "5.1.5", "5.1.6", "5.1.8"]
    note: >-
      ФСТЭК требует фиксированную 3-ролевую модель самого средства
      контейнеризации (разработчик образов / администратор ИС / администратор
      безопасности) — она не соответствует 1:1 гибкой ролевой модели
      Kubernetes RBAC, которая не ограничена тремя ролями. Вместо проверки
      конкретной 3-ролевой структуры инструмент проверяет соблюдение принципа
      минимальных привилегий в фактически настроенном RBAC кластера (см.
      RBAC Analysis). rbac-analyzer.pod-exec-access и
      rbac-analyzer.rbac-self-modification не имеют прямого соответствия ни
      одному контролу в CIS Kubernetes Benchmark v2.0.1 (в старой версии
      бенчмарка они входили в сборный 5.1.3, но новая структура раздела 5.1
      не содержит эквивалентного пункта).

  - id: "14.1"
    title: "Права роли «разработчик образов контейнеров» (смена пароля, создание/изменение/удаление образов)"
    section: "Управление доступом"
    applicable: false
    naReason: "Конкретный набор полномочий фиксированной роли продукта — специфика внутренней модели пользователей средства контейнеризации, не сопоставимо с объектами Kubernetes RBAC."

  - id: "14.2"
    title: "Права роли «администратор информационной (автоматизированной) системы» (смена пароля, запуск/остановка контейнеров)"
    section: "Управление доступом"
    applicable: false
    naReason: "Конкретный набор полномочий фиксированной роли продукта — не сопоставимо с объектами Kubernetes RBAC."

  - id: "14.3"
    title: "Права роли «администратор безопасности средства контейнеризации» (назначение прав, управление учётными записями, чтение и выгрузка журнала событий)"
    section: "Управление доступом"
    applicable: false
    naReason: "Конкретный набор полномочий фиксированной роли продукта — не сопоставимо с объектами Kubernetes RBAC."

  - id: "15.1"
    title: "Первичная идентификация и парольная аутентификация пользователей (длина/алфавит пароля, блокировка после неудачных попыток, защищённое хранение)"
    section: "Идентификация и аутентификация"
    applicable: false
    naReason: >-
      Kubernetes не имеет встроенной парольной аутентификации пользователей
      (аутентификация — через x509-сертификаты, bearer-токены, OIDC,
      webhook); требование о длине/алфавите пароля и защищённом хранилище
      паролей концептуально неприменимо к архитектуре Kubernetes auth.
      Требование о непревышении привилегий хостовой ОС при запуске
      контейнерных процессов частично покрывается workload.no-privileged-containers
      и workload.run-as-non-root (см. соответствующие контролы CIS 5.2.2/5.2.7).

  - id: "15.2"
    title: "Парольная политика для класса защиты 5 (длина/алфавит пароля, блокировка после неудачных попыток)"
    section: "Идентификация и аутентификация"
    applicable: false
    naReason: "См. 15.1 — концептуально неприменимо к архитектуре аутентификации Kubernetes."

  - id: "15.3"
    title: "Парольная политика для класса защиты 4; запрет запуска процессов с привилегиями администраторов ИС/безопасности в хостовой ОС"
    section: "Идентификация и аутентификация"
    applicable: false
    naReason: "См. 15.1 — концептуально неприменимо к архитектуре аутентификации Kubernetes."

  - id: "16.1"
    title: "Централизованное создание/изменение/хранение/получение/удаление и обновление образов, чтение/удаление и выгрузка журнала событий"
    section: "Централизованное управление"
    applicable: false
    naReason: "Функциональность управления реестром образов и журналом событий на уровне продукта (container registry/log management) — не состояние объектов кластера, проверяемое через API."

  - id: "16.2"
    title: "Анализ событий безопасности для выявления инцидентов, оповещение администратора безопасности, формирование отчётов (классы защиты 5 и 4)"
    section: "Централизованное управление"
    applicable: false
    naReason: "Функциональность SIEM-подобного анализа событий на уровне продукта — вне области видимости API-аудита манифестов/RBAC кластера."
