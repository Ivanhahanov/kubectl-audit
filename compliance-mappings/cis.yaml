  - id: "5.1.5"
    title: "Ensure that default service accounts are not actively used"
    section: "RBAC and Service Accounts"
    applicable: true
    policyIds: ["workload.no-default-serviceaccount"]
    nativeCheckIds: ["rbac-analyzer.default-serviceaccount-bound"]
    note: "Two complementary angles: workload.no-default-serviceaccount checks each workload sets spec.serviceAccountName to something other than \"default\"; rbac-analyzer.default-serviceaccount-bound checks whether the \"default\" ServiceAccount itself has roles bound to it at all."

  - id: "5.1.6"
    title: "Ensure that Service Account Tokens are only mounted where necessary"
    section: "RBAC and Service Accounts"
    applicable: true
    nativeCheckIds: ["rbac-analyzer.automount-with-sensitive-access"]

  - id: "5.1.7"
    title: "Avoid use of system:masters group"
    section: "RBAC and Service Accounts"
    applicable: true
    nativeCheckIds: ["rbac-analyzer.system-masters-usage"]
    note: >-
      Flags every RoleBinding/ClusterRoleBinding of the built-in
      system:masters group, worded as "expected at cluster bootstrap, track
      it" (low severity) rather than "fix it" — self-hosted clusters
      (kubeadm, kind) always have one such binding, and that alone isn't a
      misconfiguration. Deliberately unaffected by --include-system-rbac's
      general system:-subject filter (see internal/rbac), since seeing every
      binding beyond the expected bootstrap one is exactly the point.

  - id: "5.1.8"
    title: "Limit use of the Bind, Impersonate and Escalate permissions in the Kubernetes cluster"
    section: "RBAC and Service Accounts"
    applicable: true
    nativeCheckIds: ["rbac-analyzer.escalation-verb"]

  - id: "5.1.9"
    title: "Minimize access to create persistent volumes"
    section: "RBAC and Service Accounts"
    applicable: true
    policyIds: ["rbac.no-persistentvolume-create-access"]

  - id: "5.1.10"
    title: "Minimize access to the proxy sub-resource of nodes"
    section: "RBAC and Service Accounts"
    applicable: true
    policyIds: ["rbac.no-node-proxy-access"]

  - id: "5.1.11"
    title: "Minimize access to the approval sub-resource of certificatesigningrequests objects"
    section: "RBAC and Service Accounts"
    applicable: true
    policyIds: ["rbac.no-csr-approval-access"]

  - id: "5.1.12"
    title: "Minimize access to webhook configuration objects"
    section: "RBAC and Service Accounts"
    applicable: true
    policyIds: ["rbac.no-webhook-config-write-access"]

  - id: "5.1.13"
    title: "Minimize access to the service account token creation"
    section: "RBAC and Service Accounts"
    applicable: true
    policyIds: ["rbac.no-serviceaccount-token-create-access"]

  # 5.2 Pod Security Standards

  - id: "5.2.1"
    title: "Ensure that the cluster has at least one active policy control mechanism in place"
    section: "Pod Security Standards"
    applicable: true
    nativeCheckIds: ["psa-analyzer.no-active-enforcement"]
    note: >-
      Checks whether each namespace sets the pod-security.kubernetes.io/enforce
      label — with one cross-check: if the kube-apiserver static Pod is
      observed and sets --admission-control-config-file (which can configure
      cluster-wide PodSecurityConfiguration defaults, requiring no
      per-namespace label at all), this check backs off entirely rather than
      false-failing every namespace on a cluster actually enforcing PSA
      cluster-wide. It still can't verify the file's actual content (not
      visible via the API) or which enforcement level is configured, and
      doesn't know whether a third-party admission controller (Kyverno, OPA
      Gatekeeper, ...) is enforcing PSS-equivalent rules by some other
      mechanism instead. This tool's own policy engine is itself a form of
      "active policy control," just not an in-cluster admission-time one.

  - id: "5.2.2"
    title: "Minimize the admission of privileged containers"
    section: "Pod Security Standards"
    applicable: true
    policyIds: ["workload.no-privileged-containers"]

  - id: "5.2.3"
    title: "Minimize the admission of containers wishing to share the host process ID namespace"
    section: "Pod Security Standards"
    applicable: true
    policyIds: ["workload.no-host-namespaces"]
    note: "workload.no-host-namespaces checks hostPID, hostIPC, and hostNetwork together as a single policy; it does not distinguish which specific host namespace was shared in the finding message."

  - id: "5.2.4"
    title: "Minimize the admission of containers wishing to share the host IPC namespace"
    section: "Pod Security Standards"
    applicable: true
    policyIds: ["workload.no-host-namespaces"]
    note: "workload.no-host-namespaces checks hostPID, hostIPC, and hostNetwork together as a single policy; it does not distinguish which specific host namespace was shared in the finding message."

  - id: "5.2.5"
    title: "Minimize the admission of containers wishing to share the host network namespace"
    section: "Pod Security Standards"
    applicable: true
    policyIds: ["workload.no-host-namespaces"]
    note: "workload.no-host-namespaces checks hostPID, hostIPC, and hostNetwork together as a single policy; it does not distinguish which specific host namespace was shared in the finding message."

  - id: "5.2.6"
    title: "Minimize the admission of containers with allowPrivilegeEscalation"
    section: "Pod Security Standards"
    applicable: true
    policyIds: ["workload.no-privileged-containers"]

  - id: "5.2.7"
    title: "Minimize the admission of root containers"
    section: "Pod Security Standards"
    applicable: true
    policyIds: ["workload.run-as-non-root"]

  - id: "5.2.8"
    title: "Minimize the admission of containers with the NET_RAW capability"
    section: "Pod Security Standards"
    applicable: true
    policyIds: ["workload.drop-all-capabilities"]
    note: "workload.drop-all-capabilities requires every capability to be dropped (securityContext.capabilities.drop includes ALL), which is a stricter check than NET_RAW alone — a FAIL here means NET_RAW (among other capabilities) was not confirmed dropped."

  - id: "5.2.9"
    title: "Minimize the admission of containers with capabilities assigned"
    section: "Pod Security Standards"
    applicable: true
    policyIds: ["workload.drop-all-capabilities"]

  - id: "5.2.10"
    title: "Minimize the admission of Windows HostProcess Containers"
    section: "Pod Security Standards"
    applicable: true
    implemented: false
    note: "Not implemented in this release: would require checking securityContext.windowsOptions.hostProcess on pods scheduled to Windows nodes. This tool's bundled policies have so far only targeted Linux container security context fields."

  - id: "5.2.11"
    title: "Minimize the admission of HostPath volumes"
    section: "Pod Security Standards"
    applicable: true
    policyIds: ["workload.no-hostpath-volumes"]

  - id: "5.2.12"
    title: "Minimize the admission of containers which use HostPorts"
    section: "Pod Security Standards"
    applicable: true
    policyIds: ["workload.no-hostports"]

  # 5.3 Network Policies and CNI

  - id: "5.3.1"
    title: "Ensure that the CNI in use supports Network Policies"
    section: "Network Policies and CNI"
    applicable: false
    naReason: >-
      Whether the installed CNI plugin supports NetworkPolicy enforcement is a
      property of the CNI's implementation, not a single Kubernetes API object
      this tool can query directly. netpol-analyzer.no-network-policy-coverage
      (control 5.3.2) already detects Cilium/Calico CRD presence as a coverage
      signal, which structurally covers the practical concern (does *some*
      enforceable network policy exist) without asserting CNI capability as a
      distinct fact.

  - id: "5.3.2"
    title: "Ensure that all Namespaces have Network Policies defined"
    section: "Network Policies and CNI"
    applicable: true
    nativeCheckIds: ["netpol-analyzer.no-network-policy-coverage"]
    note: >-
      Checked precisely for native Kubernetes NetworkPolicy (podSelector +
      policyTypes matched against each workload's pod-template labels).
      Cilium (CiliumNetworkPolicy/CiliumClusterwideNetworkPolicy) and Calico
      (crd.projectcalico.org/v1 NetworkPolicy/GlobalNetworkPolicy) are only
      checked for presence, not simulated in detail — see internal/netpol.

  # 5.4 Secrets Management

  - id: "5.4.1"
    title: "Prefer using secrets as files over secrets as environment variables"
    section: "Secrets Management"
    applicable: true
    policyIds: ["secrets.no-secrets-via-env"]

  - id: "5.4.2"
    title: "Consider external secret storage"
    section: "Secrets Management"
    applicable: false
    naReason: "An architectural recommendation to adopt an external secrets manager (e.g. Vault, cloud KMS-backed secret stores); not a specific Kubernetes object state to check pass/fail."

  # 5.5 Extensible Admission Control

  - id: "5.5.1"
    title: "Configure Image Provenance using ImagePolicyWebhook admission controller"
    section: "Extensible Admission Control"
    applicable: true
    implemented: false
    note: >-
      Not implemented in this release: whether --enable-admission-plugins
      includes ImagePolicyWebhook is visible via the kube-apiserver static
      Pod's command-line flags (the same mechanism already used for
      admission-serviceaccount/admission-namespacelifecycle/
      admission-noderestriction), so this is technically checkable. Left
      out because, like EventRateLimit (1.2.9) and AlwaysPullImages
      (1.2.11), it's an opt-in plugin CIS itself frames as situational —
      it also requires a working ImagePolicyWebhook backend service that
      almost no cluster runs, so a presence-only check would FAIL on
      nearly every cluster regardless of actual image-provenance posture,
      which isn't an actionable signal.

  # 5.6 General Policies

  - id: "5.6.1"
    title: "Create administrative boundaries between resources using namespaces"
    section: "General Policies"
    applicable: false
    naReason: "Whether namespaces are used as an administrative boundary at all is an organizational practice, not a single object state with a pass/fail signal applicable to arbitrary clusters."

  - id: "5.6.2"
    title: "Ensure that the seccomp profile is set to docker/default in your pod definitions"
    section: "General Policies"
    applicable: true
    policyIds: ["workload.seccomp-profile-required"]

  - id: "5.6.3"
    title: "Apply Security Context to Your Pods and Containers"
    section: "General Policies"
    applicable: true
    policyIds:
      - "workload.no-privileged-containers"
      - "workload.run-as-non-root"
      - "workload.read-only-root-fs"
      - "workload.drop-all-capabilities"
    note: "Bundles the concrete securityContext-related policies this tool already checks; CIS's own audit procedure for this control is a general manual review, not a single specific setting."

  - id: "5.6.4"
    title: "The default namespace should not be used"
    section: "General Policies"
    applicable: true
    policyIds: ["workload.no-default-namespace"]
    note: "Only flags an *explicit* namespace: default — an unset/empty metadata.namespace (common in Helm/Kustomize templates that rely on -n/.Release.Namespace at apply time) is given the benefit of the doubt rather than assumed to resolve to \"default\"."
