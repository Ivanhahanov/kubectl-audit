# CIS Kubernetes Benchmark control table (v2.0.1, 2026-04-29, covers
# Kubernetes v1.34-v1.35).
#
# Section 5 ("Policies") was substantially restructured in v2.0.1 versus
# older benchmark revisions: RBAC and Pod Security Standards got several new,
# more granular controls (5.1.7-5.1.13, 5.2.8, 5.2.10, 5.2.12), two new
# sections were added (5.4 Secrets Management, 5.5 Extensible Admission
# Control), and the old "General Policies" image-tag-pinning and
# resource-limits controls (formerly 5.7.2/5.7.3) were dropped from the
# benchmark entirely — the underlying policies (workload.no-latest-tag,
# workload.resource-limits-required) still run and still produce findings,
# they're just no longer tied to a numbered CIS control.
#
# Sections 1-4 (control plane components, etcd, control-plane configuration
# files, worker node/kubelet configuration) generally require SSH/file
# access to node filesystems and process arguments that a kubectl plugin
# fundamentally cannot see through the Kubernetes API — those sub-sections
# (1.1 node config file permissions, 3.1 user auth methods, 3.2.2 audit
# policy content, worker nodes/kubelet) still point at kube-bench.
#
# Sections 1.2 (API Server), 1.3 (Controller Manager), 1.4 (Scheduler), and 2
# (etcd) are different: on a self-hosted/kubeadm-style cluster (including
# kind), these components run as ordinary static Pods, so their
# command-line flags ARE visible via the Kubernetes API, the same way any
# other Pod spec is (see internal/controlplane). Every control backed by
# this is an INDIRECT/heuristic signal, not a kube-bench-grade check — it
# reflects what a flag is set to in the Pod spec, not confirmed via
# node/file access — and every such control's `note` says so explicitly, and
# every finding message it produces is prefixed "[indirect signal — ...]".
# On a managed control plane (EKS/GKE/AKS/...) that doesn't expose these
# Pods at all, these controls report NOT_APPLICABLE for the run instead of a
# false PASS (see compliance.OverrideUnobserved, wired in
# internal/cli/orchestrate.go).
id: cis
title: "CIS Kubernetes Benchmark"
version: "2.0.1"
controls:
  - id: "1.1"
    title: "Control Plane Node Configuration Files"
    section: "Control Plane Components"
    applicable: false
    naReason: "File permission/ownership checks on the control-plane node's config files (API server/controller-manager/scheduler/etcd pod spec files, PKI directory, admin.conf, ...) require SSH/file access to the node. Run kube-bench on the control-plane nodes for this sub-section."

